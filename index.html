<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- 外部スクリプトは一切読み込まない。通信先は GitHub API のみに制限する -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://api.github.com; img-src data:; base-uri 'none'; form-action 'none'">
<title></title>
<style>
  :root {
    color-scheme: light;
    --bg: #f7f7f5; --side: #efefec; --card: #ffffff; --raise: #ffffff;
    --text: #1c1c1a; --muted: #6b6a66; --faint: #a3a29c; --line: #e4e3df;
    --accent: #2a78d6; --accent-ink: #ffffff; --accent-soft: rgba(42, 120, 214, .12);
    --danger: #c63b3a; --ok: #0f8a3c; --warn: #b26a00;
    --p1: #e34948; --p2: #eb6834; --p3: #2a78d6;
    --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100;
    --c5: #e87ba4; --c6: #008300; --c7: #4a3aa7; --c8: #e34948;
    --shadow: 0 10px 30px rgba(0, 0, 0, .14);
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #161615; --side: #1d1d1c; --card: #222221; --raise: #2b2b29;
      --text: #ecebe6; --muted: #a8a79f; --faint: #75746e; --line: #34332f;
      --accent: #5598e7; --accent-ink: #0b0b0b; --accent-soft: rgba(85, 152, 231, .18);
      --danger: #ef6b6a; --ok: #3ccf6e; --warn: #f0a63a;
      --p1: #e66767; --p2: #d95926; --p3: #3987e5;
      --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
      --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
      --shadow: 0 10px 30px rgba(0, 0, 0, .5);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text); -webkit-text-size-adjust: 100%;
    font: 15px/1.5 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  input[type=text], input[type=password], input[type=search], input[type=number],
  input[type=date], input[type=time], select, textarea {
    width: 100%; padding: 8px 10px; background: var(--card);
    border: 1px solid var(--line); border-radius: 8px; outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  textarea { resize: vertical; min-height: 90px; line-height: 1.6; }
  button { cursor: pointer; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 7px 12px; }
  button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  a { color: var(--accent); }
  [hidden] { display: none !important; }
  .ic { display: inline-flex; width: 18px; height: 18px; flex: none; }
  .ic svg { width: 100%; height: 100%; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn-danger { color: var(--danger); }
  .icon-btn {
    border: 0; background: transparent; padding: 6px; border-radius: 6px;
    color: var(--muted); display: inline-flex; align-items: center; gap: 4px;
  }
  .icon-btn:hover { background: var(--accent-soft); color: var(--text); }
  .icon-btn.on { color: var(--warn); }
  .link-btn { border: 0; background: none; padding: 0; color: var(--accent); font-size: 13px; }

  /* ---- 初回設定（文字なし） ---- */
  #setup { display: flex; flex-direction: column; gap: 12px; max-width: 360px; margin: 18vh auto 0; padding: 0 16px; }
  #setup input { background: var(--card); padding: 10px 12px; }
  #setup input.bad { border-color: var(--danger); outline: 2px solid var(--danger); outline-offset: -1px; }
  #setup.busy { opacity: .5; pointer-events: none; }

  /* ---- 全体の配置 ---- */
  #app { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: 100vh; min-height: 100dvh; }
  #side {
    position: sticky; top: 0; height: 100vh; height: 100dvh; overflow-y: auto;
    background: var(--side); border-right: 1px solid var(--line);
    padding: 14px 10px; display: flex; flex-direction: column; gap: 2px;
  }
  #main { min-width: 0; padding: 20px 24px 160px; }
  .inner { max-width: 760px; margin: 0 auto; }
  #scrim { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, .35); z-index: 25; }
  @media (min-width: 801px) { .only-mobile { display: none !important; } }
  @media (max-width: 800px) {
    #app { grid-template-columns: minmax(0, 1fr); }
    #side {
      position: fixed; z-index: 30; left: 0; top: 0; bottom: 0; width: 280px; max-width: 85vw;
      transform: translateX(-105%); transition: transform .18s ease; box-shadow: var(--shadow);
    }
    body.drawer #side { transform: none; }
    body.drawer #scrim { display: block; }
    #main { padding: 12px 16px 160px; }
  }

  /* ---- サイドバー ---- */
  .side-search { position: relative; margin-bottom: 8px; }
  .side-search input { background: var(--card); }
  .nav-item {
    display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: transparent;
    padding: 6px 10px; border-radius: 8px; text-align: left; color: var(--text);
  }
  .nav-item:hover { background: color-mix(in srgb, var(--text) 6%, transparent); }
  .nav-item.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .nav-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 400; }
  .count.alert { color: var(--danger); font-weight: 700; }
  .nav-sec { font-size: 11px; color: var(--muted); font-weight: 700; letter-spacing: .04em; margin: 14px 10px 2px; }
  .pdot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
  .nav-item .pdot { margin: 0 4px; }
  .side-foot { margin-top: auto; padding-top: 12px; display: flex; align-items: center; gap: 2px; }
  .sync { font-size: 12px; color: var(--muted); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-left: 6px; }
  .sync.error { color: var(--danger); }
  .sync.offline, .sync.dirty { color: var(--warn); }

  /* ---- 見出し・クイック追加 ---- */
  .top { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; min-height: 40px; }
  .top h1 { font-size: 22px; margin: 0; line-height: 1.2; overflow-wrap: anywhere; }
  .top .sub { font-size: 13px; color: var(--muted); }
  .top .grow { flex: 1; min-width: 0; }
  #quick { display: flex; gap: 8px; }
  #quick input { flex: 1; min-width: 0; padding: 10px 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .qchip {
    font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--accent-soft);
    display: inline-flex; gap: 4px; align-items: center;
  }
  .qchip .ic { width: 13px; height: 13px; }

  /* ---- タスク一覧 ---- */
  .group { margin-top: 20px; }
  .group-h { display: flex; align-items: baseline; gap: 8px; margin: 0 0 4px; padding: 0 6px; }
  .group-h h3 { font-size: 13px; margin: 0; color: var(--muted); font-weight: 700; }
  .group-h.late h3 { color: var(--danger); }
  .group-h .sp { flex: 1; }
  .group-h.faint h3 { color: var(--faint); font-weight: 600; }
  .tasks { list-style: none; margin: 0; padding: 0; }
  .task { display: flex; align-items: flex-start; gap: 10px; padding: 8px 6px; border-bottom: 1px solid var(--line); border-radius: 6px; }
  .task:hover { background: color-mix(in srgb, var(--accent) 5%, transparent); }
  .task.sel { background: var(--accent-soft); }
  .check {
    flex: none; width: 20px; height: 20px; margin-top: 2px; padding: 0; border-radius: 50%;
    border: 2px solid var(--faint); background: transparent; position: relative;
  }
  .check.p1 { border-color: var(--p1); background: color-mix(in srgb, var(--p1) 14%, transparent); }
  .check.p2 { border-color: var(--p2); background: color-mix(in srgb, var(--p2) 14%, transparent); }
  .check.p3 { border-color: var(--p3); background: color-mix(in srgb, var(--p3) 14%, transparent); }
  .check:hover::after, .task.done .check::after {
    content: ""; position: absolute; left: 5px; top: 1px; width: 5px; height: 10px;
    border: solid var(--muted); border-width: 0 2px 2px 0; transform: rotate(45deg);
  }
  .task.done .check { background: var(--faint); border-color: var(--faint); }
  .task.done .check::after { border-color: var(--card); }
  .body { flex: 1; min-width: 0; cursor: pointer; outline: none; }
  .title { overflow-wrap: anywhere; }
  .task.done .title { color: var(--muted); text-decoration: line-through; }
  .meta { display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: 12.5px; color: var(--muted); margin-top: 1px; }
  .mchip { display: inline-flex; align-items: center; gap: 3px; border: 0; background: none; padding: 0; color: inherit; font-size: inherit; }
  .mchip .ic { width: 13px; height: 13px; }
  button.mchip:hover { color: var(--text); text-decoration: underline; }
  .mchip.late { color: var(--danger); font-weight: 600; }
  .mchip.today { color: var(--ok); font-weight: 600; }
  .mchip.sun { color: var(--warn); }
  .acts { display: flex; gap: 0; opacity: 0; }
  .task:hover .acts, .task.sel .acts, .task:focus-within .acts { opacity: 1; }
  @media (hover: none) { .acts { opacity: 1; } }
  .empty { color: var(--muted); text-align: center; padding: 36px 12px; font-size: 14px; }
  .nudge { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 13px; color: var(--muted); }

  /* ---- カード・統計・グラフ ---- */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-top: 14px; }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .stat b { display: block; font-size: 20px; line-height: 1.3; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12px; color: var(--muted); }
  @media (max-width: 480px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 12px; } }
  .meter { height: 6px; background: var(--line); border-radius: 3px; margin-top: 12px; overflow: hidden; }
  .meter .fill { height: 100%; background: var(--accent); border-radius: 3px; }
  .meter.over .fill { background: var(--danger); }
  .hint { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
  .hint.warn { color: var(--danger); }
  .chart { margin-top: 16px; }
  .chart-h { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .bars { height: 88px; display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 2px; border-bottom: 1px solid var(--line); }
  .bar-col { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; cursor: default; border-radius: 4px; }
  .bar-col:hover { background: color-mix(in srgb, var(--text) 5%, transparent); }
  .bar { width: min(16px, 70%); background: var(--accent); border-radius: 4px 4px 0 0; }
  .bar-val { font-size: 11px; color: var(--text); font-variant-numeric: tabular-nums; }
  .bar-labels { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 2px; font-size: 11px; color: var(--muted); text-align: center; margin-top: 3px; }
  #tip {
    position: fixed; z-index: 60; pointer-events: none; background: var(--text); color: var(--bg);
    font-size: 12px; padding: 4px 8px; border-radius: 6px; white-space: nowrap;
  }

  /* ---- マトリクス ---- */
  .matrix { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; margin-top: 14px; }
  @media (max-width: 700px) { .matrix { grid-template-columns: minmax(0, 1fr); } }
  .quad { margin-top: 0; padding: 10px 10px 4px; border-top-width: 4px; }
  .quad.q1 { border-top-color: var(--p1); }
  .quad.q2 { border-top-color: var(--p3); }
  .quad.q3 { border-top-color: var(--p2); }
  .quad.q4 { border-top-color: var(--faint); }
  .quad-h { display: flex; align-items: baseline; gap: 8px; padding: 0 6px 4px; }
  .quad-h h3 { margin: 0; font-size: 15px; }
  .quad-h span { font-size: 12px; color: var(--muted); }
  .quad .tasks { max-height: 380px; overflow-y: auto; }
  .quad .task:last-child { border-bottom: 0; }

  /* ---- レビュー ---- */
  .step { margin-top: 22px; }
  .step-h { display: flex; gap: 10px; align-items: baseline; }
  .step-n {
    width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent);
    display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex: none;
  }
  .step-h h3 { margin: 0; font-size: 15px; }
  .step-h p { margin: 0; font-size: 13px; color: var(--muted); }

  /* ---- 詳細パネル ---- */
  #detail {
    position: fixed; z-index: 20; top: 0; right: 0; bottom: 0; width: 420px; max-width: 100%;
    background: var(--card); border-left: 1px solid var(--line); box-shadow: var(--shadow);
    overflow-y: auto; padding: 12px 18px 140px;
  }
  @media (min-width: 1280px) { body.detail-open #main { padding-right: 444px; } #detail { box-shadow: none; } }
  @media (max-width: 800px) { #detail { width: 100%; border-left: 0; z-index: 35; } }
  .d-head { display: flex; align-items: center; gap: 2px; margin: 0 -6px 4px; }
  .d-head .sp { flex: 1; }
  .d-title { font-size: 18px; font-weight: 600; }
  .field { margin-top: 16px; }
  .f-label { font-size: 12px; color: var(--muted); margin-bottom: 5px; font-weight: 700; display: block; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > * { min-width: 0; }
  .mini { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .mini button { padding: 3px 11px; font-size: 13px; border-radius: 999px; }
  button[aria-pressed=true] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .icon-btn[aria-pressed=true] { background: transparent; color: var(--warn); }
  .d-head .icon-btn[aria-pressed=true] { color: var(--ok); }
  .seg { display: flex; }
  .seg button { flex: 1; border-radius: 0; margin-left: -1px; padding: 6px 4px; font-size: 14px; }
  .seg button:first-child { border-radius: 8px 0 0 8px; margin-left: 0; }
  .seg button:last-child { border-radius: 0 8px 8px 0; }
  .wd { display: flex; gap: 4px; margin-top: 8px; }
  .wd button { flex: 1; padding: 4px 0; font-size: 13px; }
  .cl-item { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
  .cl-item input[type=checkbox] { width: 18px; height: 18px; flex: none; }
  .cl-item input[type=text] { padding: 5px 8px; }
  .cl-item.done input[type=text] { color: var(--muted); text-decoration: line-through; }
  .links { margin-top: 6px; }
  .links a { display: block; font-size: 13px; overflow-wrap: anywhere; }
  .d-foot { margin-top: 20px; font-size: 12px; color: var(--muted); line-height: 1.8; }
  .toggles { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .toggles button { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 4px 12px; font-size: 13px; }
  .toggles .ic { width: 15px; height: 15px; }

  /* ---- タイマー・通知・ダイアログ ---- */
  #focusBar {
    position: fixed; z-index: 40; left: 50%; transform: translateX(-50%);
    bottom: calc(14px + env(safe-area-inset-bottom)); background: var(--text); color: var(--bg);
    border-radius: 14px; padding: 6px 8px 6px 16px; display: flex; align-items: center; gap: 10px;
    box-shadow: var(--shadow); max-width: calc(100% - 24px);
  }
  .fb-kind { font-size: 12px; opacity: .75; white-space: nowrap; }
  .fb-time { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .fb-title { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 38vw; font-size: 13px; opacity: .85; }
  #focusBar .icon-btn { color: inherit; }
  #focusBar .icon-btn:hover { background: color-mix(in srgb, var(--bg) 18%, transparent); }
  #toast {
    position: fixed; z-index: 45; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom));
    background: var(--raise); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 10px;
    padding: 6px 6px 6px 14px; display: flex; gap: 10px; align-items: center; max-width: calc(100% - 24px); font-size: 14px;
  }
  #toastMsg { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #overlay {
    position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .4);
    display: flex; align-items: flex-start; justify-content: center; padding: 6vh 16px; overflow-y: auto;
  }
  .dialog { background: var(--card); border-radius: 14px; padding: 18px 20px 20px; width: 100%; max-width: 600px; box-shadow: var(--shadow); }
  .dialog h2 { margin: 0 0 6px; font-size: 18px; }
  .dialog h3 { margin: 18px 0 6px; font-size: 14px; color: var(--muted); }
  .kv { width: 100%; border-collapse: collapse; font-size: 14px; }
  .kv td { padding: 4px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .kv td:first-child { white-space: nowrap; color: var(--muted); }
  kbd {
    font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; padding: 1px 6px; border-radius: 5px;
    border: 1px solid var(--line); background: var(--bg);
  }
  .dlg-foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
</style>
</head>
<body>
<!-- 初回設定: 上から owner/repo・ファイルのパス・トークン。どれかの欄で Enter を押すと接続する -->
<form id="setup" hidden>
  <input id="repo" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
  <input id="path" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
  <input id="token" type="password" autocomplete="off" spellcheck="false" enterkeyhint="go">
</form>

<div id="app" hidden>
  <aside id="side" aria-label="メニュー">
    <div class="side-search">
      <input id="search" type="search" placeholder="検索（/）" autocomplete="off" aria-label="検索">
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <span id="sync" class="sync" role="status"></span>
      <button id="retryBtn" class="icon-btn" type="button" hidden title="再試行" aria-label="再試行"></button>
      <button id="helpBtn" class="icon-btn" type="button" title="使い方（?）" aria-label="使い方"></button>
      <button id="settingsBtn" class="icon-btn" type="button" title="設定" aria-label="設定"></button>
    </div>
  </aside>

  <main id="main">
    <div class="inner">
      <header class="top">
        <button id="menuBtn" class="icon-btn only-mobile" type="button" aria-label="メニュー"></button>
        <div class="grow">
          <h1 id="viewTitle"></h1>
          <div id="viewSub" class="sub"></div>
        </div>
      </header>
      <form id="quick" autocomplete="off">
        <input id="quickInput" type="text" placeholder="タスクを追加　例: 明日15時 資料作成 #仕事 !1" aria-label="タスクを追加" enterkeyhint="done">
        <button class="btn-primary">追加</button>
      </form>
      <div id="quickChips" class="chips" aria-live="polite"></div>
      <div id="content"></div>
    </div>
  </main>
</div>

<aside id="detail" hidden aria-label="タスクの詳細"></aside>
<div id="focusBar" hidden role="timer"></div>
<div id="toast" hidden role="status"><span id="toastMsg"></span><button id="undoBtn" type="button">元に戻す</button></div>
<div id="overlay" hidden></div>
<div id="scrim"></div>
<div id="tip" hidden></div>
<datalist id="projList"></datalist>

<script>
'use strict';

/* =========================================================================
 * 基本
 * ========================================================================= */
const API = 'https://api.github.com';
const KEY = {
  token: 'todo.token', repo: 'todo.repo', path: 'todo.path',
  cache: 'todo.cache', pending: 'todo.pending', timer: 'todo.timer', view: 'todo.view',
};
const $ = (id) => document.getElementById(id);

// localStorage は使えない環境（プライベートモード等）もあるので必ず try で包む
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
const loadJSON = (k, def) => { try { const v = store.get(k); return v ? JSON.parse(v) : def; } catch { return def; } };
const saveJSON = (k, v) => store.set(k, JSON.stringify(v));

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const nowIso = () => new Date().toISOString();

/* =========================================================================
 * GitHub API
 * ========================================================================= */
let cfg = null; // { token, repo, path }
const cfgKey = () => `${cfg.repo}/${cfg.path}`;

function b64encode(str) {

  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}

}
async function gh(method, url, body) {

    method,
    cache: 'no-store', // API 応答はブラウザに 60 秒キャッシュされるため、古い sha を掴まないよう無効化
    headers: {
      'Accept': 'application/vnd.github+json',
      'Authorization': 'Bearer ' + cfg.token,
      'X-GitHub-Api-Version': '2022-11-28',
      ...(body ? { 'Content-Type': 'application/json' } : {}),
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  let json = null;
  try { json = await res.json(); } catch {}
  if (!res.ok) {
    const err = new Error((json && json.message) || res.statusText || 'HTTP ' + res.status);
    err.status = res.status;
    throw err;
  }

}
function contentsUrl() {
  return `/repos/${cfg.repo}/contents/${cfg.path.split('/').map(encodeURIComponent).join('/')}`;
}

  if (e instanceof SyntaxError) return 'データファイルの JSON が壊れています';
  switch (e.status) {
    case 401: return 'トークンが無効か期限切れです';
    case 403: return 'トークンの権限が足りません（Contents: Read and write が必要）';
    case 404: return 'リポジトリが見つかりません（名前、またはトークンの対象を確認）';

}

/* =========================================================================
 * 同期
 * base: GitHub 上の最新として把握している内容 / sha: その版 / pending: まだ保存していない操作
 * 画面には base に pending を順に適用したものを表示する。
 * pending と base はこの端末にも保存するので、オフラインやページを閉じても変更は消えない
 * ========================================================================= */
const st = { base: null, sha: null, loaded: false, pending: [], syncing: false, timer: null, gen: 0 };
let DATA = emptyData();

function current() {
  const d = clone(st.base || emptyData());
  for (const op of st.pending) applyOp(d, op);

  if (cfg && st.loaded) saveJSON(KEY.cache, { key: cfgKey(), sha: st.sha, base: st.base });
}
async function fetchBase() {
  const gen = st.gen; // 読み込み中に保存が終わったら、届いた内容は古いので捨てる
  let base, sha;
  try {
    const f = await gh('GET', contentsUrl());
    let b64 = f.content;
    // 1MB を超えるファイルは contents API が中身を返さないので blob API で取り直す
    if (!b64 && f.sha && f.size > 0) b64 = (await gh('GET', `/repos/${cfg.repo}/git/blobs/${f.sha}`)).content;
    const text = b64 ? b64decode(b64) : '';
    base = text.trim() ? normalize(JSON.parse(text)) : emptyData();
    sha = f.sha;
  } catch (e) {
    if (e.status !== 404) throw e;
    base = emptyData(); // ファイルがまだ無い → 最初の保存で作成
    sha = null;
  }

}
function mutate(ops) {
  ops = Array.isArray(ops) ? ops : [ops];

  for (const op of ops) { op.at = op.at || at; st.pending.push(op); }

async function sync() {
  if (st.syncing || !st.pending.length || !cfg) return;
  st.syncing = true;
  let conflicts = 0;
  try {
    if (!st.loaded) await fetchBase();
    while (st.pending.length) {
      const batch = st.pending.slice();
      const next = clone(st.base || emptyData());
      for (const op of batch) applyOp(next, op);
      next.version = 2;
      setSync('saving');
      try {
        const r = await putFile(next, st.sha, commitMessage(batch));
        st.base = next;
        st.sha = r.content.sha;
        st.gen++;
        st.pending.splice(0, batch.length);
        saveJSON(KEY.pending, st.pending);
        saveCache();
        conflicts = 0;
      } catch (e) {
        // 409: 他の端末が先に更新した / 422: sha の指定が合わない → 最新を読み直して適用し直す
        if ((e.status === 409 || e.status === 422) && ++conflicts <= 3) {
          await fetchBase();
          render();
          continue;
        }
        throw e;
      }
    }
    setSync('saved');
  } catch (e) {
    setSync(e instanceof TypeError ? 'offline' : 'error', e);
  } finally {
    st.syncing = false;
  }
}
async function reload(quiet) {
  if (!cfg || st.syncing || st.pending.length) return;
  if (!quiet) setSync('loading');
  try {
    const old = st.sha;
    await fetchBase();
    if (!quiet || st.sha !== old) render();
    if (!quiet) setSync('fresh');
  } catch (e) {
    if (e.status === 401) return logout(['token'], explain(e));
    if (!quiet) setSync(e instanceof TypeError ? 'offline' : 'error', e);
  }
}
function setSync(state, err) {

  const text = {

    saved: `保存済み ${time}`, fresh: `最新 ${time}`,

  }[state];

        ['受信箱を空にする', '日付・プロジェクト・「いつか」を決めるか、不要なら削除', act.filter((t) => isInbox(t, T)).sort(byDefault)],
        ['期限切れを片付ける', '今日やるか、日付を付け直すか、手放す', act.filter((t) => isLate(t, T)).sort(byDefault)],
        ['この先 1 週間の予定を確認する', '準備が必要なものはないか', act.filter((t) => isUpcoming(t, T) && t.due <= ymd(addDays(Td, 7))).sort((a, b) => cmp(a.due, b.due) || byDay(a, b))],
        ['止まっているタスクを見直す', '2 週間以上動きのない、日付のないタスク', act.filter((t) => !t.someday && !t.due && localYmd(t.updatedAt) <= old).sort(byDefault)],
        ['「いつか」リストを見直す', '今週から始めるものはないか', act.filter((t) => t.someday).sort((a, b) => cmp(a.createdAt, b.createdAt))],
      ];
      steps.forEach(([name, desc, items], i) => {
        nodes.push(h('section', { class: 'step' },
          h('div', { class: 'step-h' }, h('span', { class: 'step-n' }, String(i + 1)),
            h('div', null, h('h3', null, `${name}（${items.length}）`), h('p', null, desc))),
          items.length ? taskList(items, T) : null));
      });
      nodes.push(h('section', { class: 'step' },
        h('div', { class: 'step-h' }, h('span', { class: 'step-n' }, '6'),
          h('div', null, h('h3', null, '今週を振り返る'),
            h('p', null, `今週の完了 ${doneWeek} 件・集中 ${fmtMin(focusMinutes(d, (k) => k >= mon && k <= T))}`)))));
      nodes.push(h('div', { class: 'dlg-foot', style: 'justify-content:flex-start' },
        h('button', { class: 'btn-primary', type: 'button', onclick: () => { mutate({ t: 'meta', set: { lastReview: T } }); toast('週次レビューを記録しました'); } }, 'レビューを完了する')));
      break;
    }
    case 'logbook': {
      title = '完了ログ'; sub = '終わらせたこと';
      nodes.push(statsCard(d, T));
      const done = d.todos.filter((t) => t.done).sort((a, b) => cmp(b.doneAt || '', a.doneAt || ''));
      const since = ymd(addDays(Td, -logDays));
      const days = new Map();
      for (const t of done) {
        const k = t.doneAt ? localYmd(t.doneAt) : '';
        if (k < since) continue;
        if (!days.has(k)) days.set(k, []);
        days.get(k).push(t);
      }
      for (const [k, items] of days) nodes.push(group(`${fmtShort(k)}  ${relWord(k, T)}`, items, T));
      const older = done.filter((t) => (t.doneAt ? localYmd(t.doneAt) : '') < since).length;
      if (older) {
        nodes.push(h('div', { class: 'nudge' }, `それより前に ${older} 件`,
          h('button', { class: 'link-btn', type: 'button', onclick: () => { logDays += 60; render(); } }, 'さらに表示')));
      }
      if (!done.length) nodes.push(empty('まだ完了したタスクはありません。'));
      break;
    }
    case 'project': {
      title = view.name;
      const all = d.todos.filter((t) => t.project === view.name);
      const a = all.filter((t) => !t.done && !t.someday).sort(byDefault);
      const sd = all.filter((t) => !t.done && t.someday).sort(byDefault);
      const dn = all.filter((t) => t.done).sort((x, y) => cmp(y.doneAt || '', x.doneAt || ''));
      sub = `${dn.length} / ${all.length} 完了`;
      nodes.push(h('div', { class: 'card' },
        h('div', { class: 'meter', style: 'margin-top:0' }, h('div', { class: 'fill', style: `width:${all.length ? dn.length / all.length * 100 : 0}%` })),
        h('div', { class: 'mini' },
          h('button', { type: 'button', onclick: () => renameProject(view.name) }, '名前を変更'),
          dn.length ? h('button', { type: 'button', 'aria-pressed': String(showProjectDone), onclick: () => { showProjectDone = !showProjectDone; render(); } }, `完了済みを表示（${dn.length}）`) : null)));
      if (a.length) nodes.push(group('', a, T));
      if (sd.length) nodes.push(group('いつか', sd, T));
      if (showProjectDone && dn.length) nodes.push(group('完了済み', dn, T));
      if (!a.length && !sd.length) nodes.push(empty('このプロジェクトに未完了のタスクはありません。'));
      break;
    }
    case 'tag': {
      title = '@' + view.name;
      const list = act.filter((t) => t.tags.includes(view.name)).sort(byDefault);
      nodes.push(list.length ? group('', list, T) : empty('このタグの未完了タスクはありません。'));
      break;
    }
    case 'search': {
      title = '検索'; sub = '@タグ や #プロジェクト でも絞り込めます';
      const words = view.q.toLowerCase().split(/[\s\u3000]+/).filter(Boolean);
      const match = (t) => {
        const hay = [t.title, t.notes, t.project || '', ...t.tags, ...t.checklist.map((x) => x.text)].join(' ').toLowerCase();
        return words.every((w) => (w[0] === '@' && w.length > 1 ? t.tags.some((g) => g.toLowerCase().includes(w.slice(1)))
          : w[0] === '#' && w.length > 1 ? (t.project || '').toLowerCase().includes(w.slice(1)) : hay.includes(w)));
      };
      const hits = d.todos.filter(match);
      const a = hits.filter((t) => !t.done).sort(byDefault);
      const dn = hits.filter((t) => t.done).sort((x, y) => cmp(y.doneAt || '', x.doneAt || '')).slice(0, 50);
      if (a.length) nodes.push(group('未完了', a, T));
      if (dn.length) nodes.push(group('完了済み', dn, T));
      if (!hits.length) nodes.push(empty('見つかりませんでした。'));
      break;
    }
  }
  $('viewTitle').textContent = title;
  $('viewSub').textContent = sub;
  c.replaceChildren(...nodes);
}

function planCard(list, d, T) {
  const cap = Number.isFinite(d.meta.capacity) ? d.meta.capacity : 360;
  const est = list.reduce((s, t) => s + (t.estimate || 0), 0);
  const noEst = list.filter((t) => !t.estimate).length;
  const doneToday = d.todos.filter((t) => t.done && t.doneAt && localYmd(t.doneAt) === T).length;
  const over = est - cap;
  let hint = null;
  if (over > 0) hint = h('p', { class: 'hint warn' }, `見積もりが作業可能時間を ${fmtMin(over)} 超えています。明日以降に回せるものはありませんか？`);
  else if (noEst) hint = h('p', { class: 'hint' }, `見積もりのないタスクが ${noEst} 件あります。かかる時間を決めると計画が立てやすくなります。`);
  else if (list.length) hint = h('p', { class: 'hint' }, '今日の計画は作業可能時間に収まっています。');
  return h('div', { class: 'card plan' },
    h('div', { class: 'stats' },
      stat(fmtMin(est), '見積もり合計'), stat(fmtMin(cap), '作業可能時間'),
      stat(String(doneToday), '今日の完了'), stat(fmtMin(focusMinutes(d, (k) => k === T)), '今日の集中')),
    h('div', { class: 'meter' + (over > 0 ? ' over' : ''), role: 'meter', 'aria-label': '見積もり / 作業可能時間', 'aria-valuemin': '0', 'aria-valuemax': String(cap), 'aria-valuenow': String(Math.min(est, cap)) },
      h('div', { class: 'fill', style: `width:${cap ? Math.min(100, est / cap * 100) : 0}%` })),
    hint);
}

function statsCard(d, T) {
  const Td = parseYmd(T);
  const count = new Map();
  for (const t of d.todos) if (t.done && t.doneAt) { const k = localYmd(t.doneAt); count.set(k, (count.get(k) || 0) + 1); }
  const mon = ymd(mondayOf(Td));
  let week = 0;
  for (const [k, v] of count) if (k >= mon && k <= T) week += v;
  let streak = 0;
  for (let cur = count.get(T) ? Td : addDays(Td, -1); count.get(ymd(cur)); cur = addDays(cur, -1)) streak++;
  const days = [];
  for (let i = 13; i >= 0; i--) { const k = ymd(addDays(Td, -i)); days.push({ k, v: count.get(k) || 0 }); }
  const max = Math.max(1, ...days.map((x) => x.v));
  return h('div', { class: 'card' },
    h('div', { class: 'stats' },
      stat(String(count.get(T) || 0), '今日の完了'), stat(String(week), '今週の完了'),
      stat(`${streak}日`, '連続で完了'), stat(fmtMin(focusMinutes(d, (k) => k >= mon && k <= T)), '今週の集中')),
    h('div', { class: 'chart' },
      h('div', { class: 'chart-h' }, '直近 14 日の完了数'),
      h('div', { class: 'bars', role: 'img', 'aria-label': '直近14日の完了数: ' + days.map((x) => `${fmtShort(x.k)} ${x.v}件`).join('、') },
        days.map((x) => h('div', { class: 'bar-col', tabindex: '0', 'data-tip': `${fmtShort(x.k)}  ${x.v}件` },
          x.k === T && x.v ? h('span', { class: 'bar-val' }, String(x.v)) : null,
          h('div', { class: 'bar', style: `height:${x.v / max * 100}%` })))),
      h('div', { class: 'bar-labels', 'aria-hidden': 'true' },
        days.map((x, i) => h('span', null, (13 - i) % 2 === 0 ? String(parseYmd(x.k).getDate()) : '')))));
}

 * ========================================================================= */
function taskFromQuick(text) {
  const T = todayYmd();
  const Td = parseYmd(T);
  const r = parseQuick(text, Td);
  const t = { id: uid(), createdAt: nowIso() };
  if (r.title) {
    let due = r.date ? ymd(r.date) : null;
    if (r.time && !due) due = T;
    if (r.repeat) {
      t.repeat = completeRule(r.repeat, due ? parseYmd(due) : Td);
      if (!due) due = ymd(firstDue(t.repeat, Td));
    }
    Object.assign(t, { title: r.title, due, time: r.time, project: r.project, tags: r.tags, priority: r.priority, estimate: r.estimate, someday: r.someday && !due });
  } else {
    t.title = text.trim(); // 日付などの語しか無いときは、そのままタイトルにする
  }
  // 今いる一覧に合わせて補う（今日の一覧で追加したら「今日やる」など）
  if (view.type === 'project' && !t.project) t.project = view.name;
  if (view.type === 'tag') t.tags = [...new Set([...(t.tags || []), view.name])];
  if (view.type === 'today' && !t.due && !t.someday) t.myDay = T;
  if (view.type === 'someday' && !t.due) t.someday = true;
  return normTask(t);
}
function whereLabel(t, T) {
  if (t.someday) return '「いつか」';
  if ((t.due && t.due <= T) || t.myDay === T) return '今日';
  if (t.due) return `予定（${fmtDate(t.due, T)}）`;
  if (t.project) return t.project;
  return '受信箱';
}
function updateQuickChips() {
  const text = $('quickInput').value;
  const box = $('quickChips');
  if (!text.trim()) { box.replaceChildren(); return; }
  const t = taskFromQuick(text);
  const T = todayYmd();
  const chip = (ic, label) => h('span', { class: 'qchip' }, icon(ic), label);
  const chips = [];
  if (t.due) chips.push(chip('calendar', fmtDate(t.due, T) + (t.time ? ' ' + t.time : '')));
  if (t.repeat) chips.push(chip('repeat', describeRepeat(t.repeat)));
  if (t.myDay) chips.push(chip('sun', '今日やる'));
  if (t.project) chips.push(chip('folder', t.project));
  for (const g of t.tags) chips.push(chip('tag', g));
  if (t.priority) chips.push(chip('flag', '優先度 ' + ['', '高', '中', '低'][t.priority]));
  if (t.estimate) chips.push(chip('timer', fmtMin(t.estimate)));
  if (t.someday) chips.push(chip('box', 'いつか'));
  box.replaceChildren(...chips);
}

 * 操作
 * ========================================================================= */
const findTask = (id) => DATA.todos.find((x) => x.id === id);
function addFromQuick() {
  const input = $('quickInput');
  if (!input.value.trim()) return;
  const t = taskFromQuick(input.value);
  input.value = '';
  selId = t.id;
  mutate({ t: 'add', task: t });
  toast(`「${t.title}」を${whereLabel(t, todayYmd())}に追加しました`, { t: 'restore', remove: [t.id] });
}
function toggleDone(id) {
  const t = findTask(id);
  if (!t) return;
  const snap = clone(t);
  const T = todayYmd();
  if (t.done) {
    mutate({ t: 'patch', id, set: { done: false, doneAt: null } });
    toast('未完了に戻しました', { t: 'restore', tasks: [snap] });
  } else if (t.repeat && t.due) {
    const next = nextDue(t.due, t.repeat, T);
    const logId = uid();
    mutate({ t: 'complete', id, from: t.due, next, logId });
    toast(`完了 · 次回は ${fmtDate(next, T)}`, { t: 'restore', tasks: [snap], remove: [logId] });
  } else {
    mutate({ t: 'complete', id });
    toast(`「${t.title}」を完了しました`, { t: 'restore', tasks: [snap] });
  }
}
function deleteTask(id) {
  const t = findTask(id);
  if (!t) return;
  if (detailId === id) closeDetail();
  mutate({ t: 'del', id });
  toast(`「${t.title}」を削除しました`, { t: 'restore', tasks: [clone(t)] });
}
function toggleMyDay(id) {
  const t = findTask(id);
  if (!t || t.done) return;
  const T = todayYmd();
  mutate({ t: 'patch', id, set: t.myDay === T ? { myDay: null } : { myDay: T, someday: false } });
}
function toggleSomeday(id) {
  const t = findTask(id);
  if (!t || t.done) return;
  const snap = clone(t);
  mutate({ t: 'patch', id, set: { someday: !t.someday, myDay: null } });
  toast(snap.someday ? '「いつか」から戻しました' : '「いつか」に移しました', { t: 'restore', tasks: [snap] });
}
function setPriority(id, p) {
  const t = findTask(id);
  if (t && t.priority !== p) mutate({ t: 'patch', id, set: { priority: p } });
}
function moveToToday(list) {
  const T = todayYmd();
  mutate(list.map((t) => ({ t: 'patch', id: t.id, set: { due: T } })));
  toast(`${list.length} 件を今日に移動しました`, { t: 'restore', tasks: list.map(clone) });
}
function duplicateTask(id) {
  const t = findTask(id);
  if (!t) return;
  const copy = { ...clone(t), id: uid(), done: false, doneAt: null, focus: [], createdAt: nowIso(), updatedAt: nowIso(), checklist: t.checklist.map((c) => ({ ...c, id: uid(), done: false })) };
  mutate({ t: 'add', task: copy });
  openDetail(copy.id);
  toast('複製しました', { t: 'restore', remove: [copy.id] });
}
function renameProject(name) {
  const to = prompt('新しいプロジェクト名', name);
  if (to == null || !to.trim() || to.trim() === name) return;
  mutate({ t: 'renameProject', from: name, to: to.trim() });
  setView({ type: 'project', name: to.trim() });
}

// 元に戻す（直前の 1 操作）
let lastUndo = null;
let toastTimer = null;
function toast(msg, undoOp) {
  lastUndo = undoOp || null;
  $('toastMsg').textContent = msg;
  $('undoBtn').hidden = !undoOp;
  $('toast').hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $('toast').hidden = true; }, undoOp ? 7000 : 3000);
}
function undo() {
  if (!lastUndo) return;
  const op = lastUndo;
  lastUndo = null;
  $('toast').hidden = true;
  mutate(op);
}

// 文字の入力は打ち終わって少し経ってから保存する（欄を離れたときは即保存）。
// 欄を離れた瞬間に画面を作り直すと、その直後のクリックが失われるため
const pendingEdits = new Map();
function editLater(key, fn) {
  const p = pendingEdits.get(key);
  if (p) clearTimeout(p.timer);
  pendingEdits.set(key, { fn, timer: setTimeout(() => flushEdit(key), 500) });
}
function flushEdit(key) {
  const p = pendingEdits.get(key);
  if (!p) return;
  clearTimeout(p.timer);
  pendingEdits.delete(key);
  p.fn();
}
function flushEdits() { for (const k of [...pendingEdits.keys()]) flushEdit(k); }

function openDetail(id) {
  flushEdits();
  detailId = id;
  selId = id;
  $('detail').hidden = false;
  document.body.classList.add('detail-open');
  renderDetail(true);
  markSel();
}
function closeDetail() {

/* =========================================================================
 * 集中タイマー（ポモドーロ）
 * ========================================================================= */
let timer = loadJSON(KEY.timer, null); // { taskId, title, kind: 'work'|'break', dur(秒), startedAt, endsAt, left }
let audio = null;
let barKey = '';
const saveTimer = () => (timer ? saveJSON(KEY.timer, timer) : store.del(KEY.timer));
const timeLeft = () => (timer.left != null ? timer.left : timer.endsAt - Date.now());
function unlockAudio() {
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume?.(); } catch {}
}
function beep() {
  if (!audio) return;
  try {
    [0, 0.25, 0.5].forEach((dt) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, audio.currentTime + dt);
      g.gain.exponentialRampToValueAtTime(0.2, audio.currentTime + dt + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dt + 0.18);
      o.connect(g).connect(audio.destination);
      o.start(audio.currentTime + dt);
      o.stop(audio.currentTime + dt + 0.2);
    });
  } catch {}
}
function notify(title, body) {
  try { if ('Notification' in window && Notification.permission === 'granted') new Notification(title, { body }); } catch {}
}
function askNotify() {
  try { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission()?.catch?.(() => {}); } catch {}
}
function startFocus(id) {
  const t = findTask(id);
  if (!t) return;
  if (timer && timer.kind === 'work') stopFocus();
  const min = DATA.meta.pomo || 25;
  timer = { taskId: id, title: t.title, kind: 'work', dur: min * 60, startedAt: Date.now(), endsAt: Date.now() + min * 60000, left: null };
  saveTimer();
  unlockAudio();
  askNotify();
  tick();
}
function logFocus(tm, min) {
  mutate({ t: 'focus', id: tm.taskId, session: { id: uid(), at: new Date(tm.startedAt).toISOString(), min } });
}
function pauseFocus() { if (timer && timer.left == null) { timer.left = timeLeft(); saveTimer(); tick(); } }
function resumeFocus() { if (timer && timer.left != null) { timer.endsAt = Date.now() + timer.left; timer.left = null; saveTimer(); tick(); } }
function stopFocus() {
  if (!timer) return;
  if (timer.kind === 'work') {
    const min = Math.floor((timer.dur * 1000 - Math.max(0, timeLeft())) / 60000);
    if (min >= 1) logFocus(timer, min);
  }
  timer = null;
  saveTimer();
  tick();
}
function finishPhase() {
  const lateBy = -timeLeft();
  if (timer.kind === 'work') {
    logFocus(timer, Math.round(timer.dur / 60));
    beep();
    notify('集中時間が終わりました', timer.title);
    const b = DATA.meta.brk || 5;
    // 画面を閉じている間に休憩時間も過ぎていたら、休憩は飛ばす
    timer = lateBy > b * 60000 ? null
      : { taskId: timer.taskId, title: timer.title, kind: 'break', dur: b * 60, startedAt: Date.now(), endsAt: Date.now() + b * 60000, left: null };
  } else {
    beep();
    notify('休憩が終わりました', '次の集中を始めましょう');
    timer = null;
  }
  saveTimer();
}
function tick() {
  const bar = $('focusBar');
  if (!cfg || $('app').hidden) { bar.hidden = true; return; }
  if (timer && timeLeft() <= 0) finishPhase();
  if (!timer) {
    bar.hidden = true;
    barKey = '';
    document.title = 'Todo';
    return;
  }
  const left = Math.max(0, timeLeft());
  const mmss = `${pad(Math.floor(left / 60000))}:${pad(Math.floor(left / 1000) % 60)}`;
  const paused = timer.left != null;
  const key = `${timer.kind}|${paused}|${timer.taskId}`;
  if (key !== barKey) {
    barKey = key;
    bar.replaceChildren(
      h('span', { class: 'fb-kind' }, timer.kind === 'work' ? '集中' : '休憩'),
      h('span', { class: 'fb-time', id: 'fbTime' }),
      h('span', { class: 'fb-title' }, timer.title),
      paused
        ? h('button', { class: 'icon-btn', type: 'button', title: '再開', 'aria-label': '再開', onclick: resumeFocus }, icon('play'))
        : h('button', { class: 'icon-btn', type: 'button', title: '一時停止', 'aria-label': '一時停止', onclick: pauseFocus }, icon('pause')),
      timer.kind === 'work'
        ? h('button', { class: 'icon-btn', type: 'button', title: '終了して記録', 'aria-label': '終了して記録', onclick: stopFocus }, icon('stop'))
        : h('button', { class: 'icon-btn', type: 'button', title: '休憩を飛ばす', 'aria-label': '休憩を飛ばす', onclick: stopFocus }, icon('skip')));
  }
  $('fbTime').textContent = mmss;
  bar.hidden = false;
  document.title = `${mmss} ${timer.kind === 'work' ? '集中' : '休憩'}`;
}

/* =========================================================================
 * 初回設定・接続
 * 設定画面には文字を出さない。失敗したら怪しい欄を赤枠にし、詳細はコンソールにだけ出す
 * ========================================================================= */
const FIELDS = ['repo', 'path', 'token'];
function showSetup(bad = [], detail) {
  document.title = '';
  $('app').hidden = true;
  $('focusBar').hidden = true;
  $('toast').hidden = true;
  $('setup').hidden = false;
  for (const id of FIELDS) $(id).classList.toggle('bad', bad.includes(id));
  if (detail) console.warn(detail);
}
function badFields(e) {
  if (e instanceof TypeError) return FIELDS; // 通信できない
  if (e.status === 401 || e.status === 403) return ['token'];
  if (e.status === 404) return ['repo', 'token']; // 名前違い、またはトークンの対象外
  return FIELDS;
}
async function connect() {
  const repo = $('repo').value.trim().replace(/^https:\/\/github\.com\//, '').replace(/\/+$/, '');
  const path = $('path').value.trim().replace(/^\/+/, '');
  const token = $('token').value.trim();
  const bad = [];
  if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) bad.push('repo');
  if (!path) bad.push('path');
  if (!token) bad.push('token');
  if (bad.length) return showSetup(bad);
  cfg = { token, repo, path };
  $('setup').classList.add('busy');
  try {
    const info = await gh('GET', `/repos/${repo}`);
    if (!info.private) {
      cfg = null;
      return showSetup(['repo'], '公開リポジトリには接続しない');
    }
    store.set(KEY.token, token);
    store.set(KEY.repo, repo);
    store.set(KEY.path, path);
    $('token').value = '';
    await showApp();
  } catch (e) {
    cfg = null;
    showSetup(badFields(e), explain(e));
  } finally {
    $('setup').classList.remove('busy');
  }
}
async function showApp() {
  $('setup').hidden = true;
  $('app').hidden = false;
  document.title = 'Todo';
  view = loadJSON(KEY.view, { type: 'today' });
  if (!view || typeof view.type !== 'string' || view.type === 'search') view = { type: 'today' };
  prevView = view;
  // 前回の内容をすぐに表示し、裏で最新を取りに行く
  const cache = loadJSON(KEY.cache, null);
  if (cache && cache.key === cfgKey() && cache.base) {
    st.base = normalize(cache.base);
    st.sha = cache.sha || null;
    st.loaded = true;
  }
  st.pending = (loadJSON(KEY.pending, []) || []).filter((op) => op && typeof op.t === 'string');
  render();
  tick();
  setSync('loading');
  try {
    await fetchBase();
    render();
    if (st.pending.length) sync(); else setSync('fresh');
  } catch (e) {
    if (e.status === 401) return logout(['token'], explain(e));
    setSync(e instanceof TypeError ? 'offline' : 'error', e);
  }
}
function logout(bad, detail) {
  for (const k of [KEY.token, KEY.cache, KEY.pending, KEY.timer]) store.del(k);
  cfg = null;
  Object.assign(st, { base: null, sha: null, loaded: false, pending: [], syncing: false });
  clearTimeout(st.timer);
  timer = null;
  closeDetail();
  closeOverlay();
  $('content').replaceChildren();
  showSetup(bad || [], detail);
}

  if (e.key === 'Escape') {
    if (!$('overlay').hidden) closeOverlay();
    else if (typing) el.blur();
    else if (detailId) closeDetail();
    else if (document.body.classList.contains('drawer')) document.body.classList.remove('drawer');
    else { selId = null; markSel(); }
    return;
  }
  if (!$('overlay').hidden) return;
  if (typing || e.altKey) return;
  if (e.metaKey || e.ctrlKey) {
    if (e.key === 'z') { e.preventDefault(); undo(); }
    return;
  }
  if ((el.tagName === 'BUTTON' || el.tagName === 'A') && (e.key === ' ' || e.key === 'Enter')) return; // ボタン自体の動作に任せる
  if (gWait) {
    gWait = false;
    const v = { i: 'inbox', t: 'today', u: 'upcoming', a: 'anytime', s: 'someday', m: 'matrix', r: 'review', l: 'logbook' }[e.key];
    if (v) { e.preventDefault(); setView({ type: v }); }
    return;
  }
  const sel = selId && findTask(selId) ? selId : null;
  switch (e.key) {
    case 'g': gWait = true; setTimeout(() => { gWait = false; }, 1500); break;
    case 'n': case 'q': e.preventDefault(); $('quickInput').focus(); break;
    case '/': e.preventDefault(); document.body.classList.add('drawer'); $('search').focus(); break;
    case 'j': case 'ArrowDown': e.preventDefault(); moveSel(1); break;
    case 'k': case 'ArrowUp': e.preventDefault(); moveSel(-1); break;
    case 'Enter': case 'e': if (sel) { e.preventDefault(); openDetail(sel); } break;
    case 'x': case ' ': if (sel) { e.preventDefault(); toggleDone(sel); } break;
    case 't': if (sel) toggleMyDay(sel); break;
    case 's': if (sel) toggleSomeday(sel); break;
    case '1': case '2': case '3': case '0': if (sel) setPriority(sel, +e.key); break;
    case 'f': if (sel) startFocus(sel); break;
    case 'Delete': case 'Backspace': if (sel) { e.preventDefault(); deleteTask(sel); } break;
    case 'z': undo(); break;
    case '?': openHelp(); break;
  }
});

// グラフのツールチップ
function showTip(e) {
  const el = e.target.closest && e.target.closest('[data-tip]');
  const tip = $('tip');
  if (!el) { tip.hidden = true; return; }
  tip.textContent = el.dataset.tip;
  tip.hidden = false;
  const r = el.getBoundingClientRect();
  tip.style.left = Math.max(8, Math.min(window.innerWidth - tip.offsetWidth - 8, r.left + r.width / 2 - tip.offsetWidth / 2)) + 'px';
  tip.style.top = Math.max(8, r.top - tip.offsetHeight - 6) + 'px';
}
document.addEventListener('mouseover', showTip);
document.addEventListener('focusin', showTip);
document.addEventListener('scroll', () => { $('tip').hidden = true; }, true);

// 別の端末での変更を拾う・日付が変わったら描き直す
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !cfg) return;
  tick();
  if (st.pending.length) sync(); else reload(true);
});
setInterval(() => {
  if (!cfg || document.visibilityState !== 'visible') return;
  if (st.pending.length) sync(); else reload(true);
  if (renderedDay !== todayYmd()) render();
}, 60000);
setInterval(tick, 1000);
window.addEventListener('online', () => { if (cfg) sync(); });
window.addEventListener('beforeunload', (ev) => {
  // 未保存の操作は端末に残るので失われないが、送信中だけは念のため確認する
  if (st.syncing) { ev.preventDefault(); ev.returnValue = ''; }
});

/* =========================================================================
 * 起動
 * 初期値は持たない（公開ページに非公開リポジトリの名前を書かないため）。
 * 一度接続した端末では、その端末に保存した値を使う
 * ========================================================================= */
(function init() {
  const token = store.get(KEY.token);
  const repo = store.get(KEY.repo);
  const path = store.get(KEY.path);
  if (repo) $('repo').value = repo;
  if (path) $('path').value = path;
  if (token && repo && path) {
    cfg = { token, repo, path };
    showApp();
  } else {
    showSetup();
  }
})();
</script>
