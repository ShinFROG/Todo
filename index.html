<!doctype html>
<html lang="ja" data-accent="blue">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151514" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<!-- 外部スクリプトは一切読み込まない。通信先は GitHub API のみに制限する -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://api.github.com; img-src 'self' data:; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<title></title>
<style>
  /* ======================= 色 ======================= */
  :root {
    color-scheme: light;
    --bg: #f6f6f4; --card: #ffffff; --raise: #ffffff; --sunk: #ecebe8;
    --text: #1b1b19; --muted: #6b6a66; --faint: #a3a29c; --line: #e3e2de;
    --danger: #c63b3a; --ok: #1f9d55; --warn: #c27400;
    --p1: #e34948; --p2: #eb6834; --p3: #2a78d6;
    --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100;
    --c5: #e87ba4; --c6: #008300; --c7: #4a3aa7; --c8: #e34948;
    --accent: #2a78d6; --accent-ink: #ffffff;
    --shadow: 0 12px 40px rgba(0, 0, 0, .16);
    --radius: 14px;
  }
  html[data-accent=green] { --accent: #13895c; }
  html[data-accent=orange] { --accent: #d4581f; }
  html[data-accent=purple] { --accent: #6a4fd8; }
  html[data-accent=pink] { --accent: #cf3f78; }
  html[data-accent=graphite] { --accent: #4a4a46; }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #151514; --card: #1f1f1d; --raise: #292927; --sunk: #0f0f0e;
      --text: #ecebe6; --muted: #a9a8a0; --faint: #74736d; --line: #33322e;
      --danger: #ef6b6a; --ok: #3ccf7a; --warn: #f0a63a;
      --p1: #e66767; --p2: #e2703f; --p3: #3987e5;
      --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
      --c5: #d55181; --c6: #2f9a2f; --c7: #9085e9; --c8: #e66767;
      --accent: #5598e7; --accent-ink: #0b0b0b;
      --shadow: 0 12px 40px rgba(0, 0, 0, .55);
    }
    html[data-accent=green] { --accent: #3cc68a; }
    html[data-accent=orange] { --accent: #f08a50; }
    html[data-accent=purple] { --accent: #9d8bf0; }
    html[data-accent=pink] { --accent: #ec7aa6; }
    html[data-accent=graphite] { --accent: #c9c8c2; }
  }
  :root { --accent-soft: color-mix(in srgb, var(--accent) 14%, transparent); }

  /* ======================= 基本 ======================= */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text); -webkit-text-size-adjust: 100%;
    font: 16px/1.5 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  /* iOS は 16px 未満の入力欄にフォーカスすると拡大するので 16px にそろえる */
  input[type=text], input[type=password], input[type=search], input[type=number], input[type=url],
  input[type=date], input[type=time], select, textarea {
    width: 100%; padding: 10px 12px; font-size: 16px; background: var(--card);
    border: 1px solid var(--line); border-radius: 10px; outline: none; min-height: 44px;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  textarea { resize: none; line-height: 1.6; }
  button { cursor: pointer; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 8px 14px; min-height: 36px; }
  button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  a { color: var(--accent); }
  [hidden] { display: none !important; }
  .ic { display: inline-flex; width: 20px; height: 20px; flex: none; }
  .ic svg { width: 100%; height: 100%; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .btn-danger { color: var(--danger); }
  .icon-btn {
    border: 0; background: transparent; padding: 8px; border-radius: 10px; min-height: 40px; min-width: 40px;
    color: var(--muted); display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .icon-btn:hover { background: var(--accent-soft); color: var(--text); }
  .link-btn { border: 0; background: none; padding: 0; min-height: 0; color: var(--accent); font-size: 14px; font-weight: 600; }
  .sp { flex: 1; }
  .muted { color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  /* ======================= 初回設定（文字なし） ======================= */
  #setup { display: flex; flex-direction: column; gap: 12px; max-width: 360px; margin: 18vh auto 0; padding: 0 16px; }
  #setup input { background: var(--card); }
  #setup input.bad { border-color: var(--danger); outline: 2px solid var(--danger); outline-offset: -1px; }
  #setup.busy { opacity: .5; pointer-events: none; }

  /* ======================= 骨組み ======================= */
  #app { min-height: 100vh; min-height: 100dvh; }
  #main { min-width: 0; padding: calc(env(safe-area-inset-top) + 8px) 16px calc(150px + env(safe-area-inset-bottom)); }
  .inner { max-width: 720px; margin: 0 auto; }
  @media (min-width: 900px) {
    #app { display: grid; grid-template-columns: 264px minmax(0, 1fr); }
    #tabbar { display: none !important; }
    #main { padding: 28px 32px 120px; }
  }
  @media (max-width: 899px) { #side { display: none !important; } }

  /* サイドバー（広い画面） */
  #side {
    position: sticky; top: 0; height: 100vh; height: 100dvh; overflow-y: auto;
    background: var(--sunk); border-right: 1px solid var(--line);
    padding: 16px 10px; display: flex; flex-direction: column; gap: 2px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: transparent;
    padding: 7px 10px; min-height: 38px; border-radius: 10px; text-align: left; color: var(--text);
  }
  .nav-item:hover { background: color-mix(in srgb, var(--text) 6%, transparent); }
  .nav-item.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .nav-item .ic { color: var(--accent); }
  .nav-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 400; }
  .count.alert { color: var(--danger); font-weight: 700; }
  .nav-sec { font-size: 13px; color: var(--muted); font-weight: 700; margin: 16px 10px 4px; }
  .pdot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
  .nav-item .pdot { margin: 0 5px; }
  .side-foot { margin-top: auto; padding-top: 12px; display: flex; align-items: center; gap: 2px; }
  .sync { font-size: 13px; color: var(--muted); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-left: 8px; }
  .sync.error { color: var(--danger); }
  .sync.offline, .sync.dirty { color: var(--warn); }

  /* 下のタブ（スマホ） */
  #tabbar {
    position: fixed; z-index: 30; left: 0; right: 0; bottom: 0;
    display: grid; grid-template-columns: repeat(6, minmax(0, 1fr));
    padding: 4px 8px env(safe-area-inset-bottom);
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    -webkit-backdrop-filter: saturate(1.6) blur(18px); backdrop-filter: saturate(1.6) blur(18px);
    border-top: 1px solid var(--line);
  }
  .tab {
    position: relative; border: 0; background: none; border-radius: 0; min-height: 52px; padding: 6px 0 4px;
    display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--muted);
  }
  .tab .ic { width: 25px; height: 25px; }
  .tab.on { color: var(--accent); font-weight: 600; }
  .tab .badge {
    position: absolute; top: 3px; left: calc(50% + 8px); min-width: 18px; height: 18px; padding: 0 5px;
    border-radius: 9px; background: var(--faint); color: #fff; font-size: 11px; line-height: 18px; font-weight: 700;
  }
  .tab .badge.alert { background: var(--danger); }

  /* 追加ボタン */
  #fab {
    position: fixed; z-index: 31; right: 18px; bottom: calc(74px + env(safe-area-inset-bottom));
    width: 58px; height: 58px; border-radius: 50%; padding: 0; border: 0;
    background: var(--accent); color: var(--accent-ink);
    box-shadow: 0 10px 26px color-mix(in srgb, var(--accent) 45%, transparent), 0 2px 6px rgba(0, 0, 0, .12);
    display: flex; align-items: center; justify-content: center; transition: transform .2s;
  }
  #fab .ic { width: 30px; height: 30px; }
  #fab:active { transform: scale(.92); }
  @media (min-width: 900px) { #fab { bottom: 30px; right: 30px; } }

  /* ======================= 見出し ======================= */
  .top { display: flex; align-items: flex-end; gap: 12px; margin: 6px 0 14px; min-height: 52px; }
  .top .grow { flex: 1; min-width: 0; }
  .top h1 { font-size: 32px; font-weight: 800; letter-spacing: -.01em; margin: 0; line-height: 1.15; overflow-wrap: anywhere; }
  .top .sub { font-size: 14px; color: var(--muted); margin-top: 2px; }
  .ring-sm { flex: none; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .ring-sm svg { width: 44px; height: 44px; transform: rotate(-90deg); }
  .ring-sm .trk { stroke: var(--line); }
  .ring-sm .val { stroke: var(--accent); transition: stroke-dashoffset .5s ease; }
  #syncPill {
    border: 0; border-radius: 999px; padding: 4px 10px; min-height: 28px; font-size: 13px; font-weight: 600;
    background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); align-self: center;
  }
  #syncPill.error { background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); }

  /* ======================= タスクの行 ======================= */
  .group { margin-top: 22px; scroll-margin-top: 16px; }
  .group-h { display: flex; align-items: baseline; gap: 8px; margin: 0 0 2px; padding: 0 2px; }
  .group-h h3 { font-size: 15px; margin: 0; font-weight: 700; }
  .group-h.late h3 { color: var(--muted); }
  .group-h.faint h3 { color: var(--faint); font-weight: 600; }
  .tasks { list-style: none; margin: 0; padding: 0; }
  .task { position: relative; touch-action: pan-y; overflow: hidden; }
  .task-inner {
    position: relative; z-index: 1; display: flex; align-items: flex-start; gap: 10px;
    padding: 10px 2px 10px 0; background: var(--bg); min-height: 52px;
  }
  .task + .task .task-inner::before { content: ""; position: absolute; top: 0; left: 40px; right: 0; border-top: 1px solid var(--line); }
  .task.sel .task-inner { background: color-mix(in srgb, var(--accent) 9%, var(--bg)); border-radius: 10px; }
  @media (hover: hover) { .task:hover .task-inner { background: color-mix(in srgb, var(--text) 3%, var(--bg)); } }
  .swipe-bg {
    position: absolute; inset: 0; display: flex; align-items: center; gap: 8px; padding: 0 22px;
    font-weight: 700; font-size: 15px; color: #fff; opacity: 0;
  }
  .swipe-bg .ic { width: 22px; height: 22px; }
  .done-bg { background: var(--ok); justify-content: flex-start; }
  .sched-bg { background: var(--accent); color: var(--accent-ink); justify-content: flex-end; }
  .task.swiping[data-dir=right] .done-bg, .task.swiping[data-dir=left] .sched-bg { opacity: .55; }
  .task.arm-done .done-bg, .task.arm-sched .sched-bg { opacity: 1; }
  .task.swiping { user-select: none; -webkit-user-select: none; }
  .check {
    flex: none; width: 40px; height: 40px; margin: -8px -4px -8px -6px; padding: 0; border: 0; background: none;
    display: grid; place-items: center; min-height: 0;
  }
  .ring {
    width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--faint); position: relative;
    transition: background .15s, border-color .15s, transform .15s;
  }
  .check.p1 .ring { border-color: var(--p1); background: color-mix(in srgb, var(--p1) 12%, transparent); }
  .check.p2 .ring { border-color: var(--p2); background: color-mix(in srgb, var(--p2) 12%, transparent); }
  .check.p3 .ring { border-color: var(--p3); background: color-mix(in srgb, var(--p3) 12%, transparent); }
  .ring::after {
    content: ""; position: absolute; left: 6px; top: 2px; width: 5px; height: 10px; opacity: 0;
    border: solid #fff; border-width: 0 2.4px 2.4px 0; transform: rotate(45deg);
  }
  @media (hover: hover) { .check:hover .ring::after { opacity: .5; border-color: var(--muted); } }
  .task.done .ring, .task.completing .ring { background: var(--ok); border-color: var(--ok); }
  .task.done .ring { background: var(--faint); border-color: var(--faint); }
  .task.done .ring::after, .task.completing .ring::after { opacity: 1; border-color: #fff; }
  .task.completing .ring { animation: pop .35s ease; }
  .task.completing .title { text-decoration: line-through; color: var(--muted); transition: color .2s; }
  .task.leaving { transition: height .26s ease, opacity .26s ease; opacity: 0; height: 0 !important; }
  @keyframes pop { 0% { transform: scale(1); } 45% { transform: scale(1.3); } 100% { transform: scale(1); } }
  .emo { flex: none; font-size: 20px; line-height: 26px; width: 26px; text-align: center; margin-left: -2px; }
  .body { flex: 1; min-width: 0; cursor: pointer; outline: none; padding-top: 1px; }
  .title { overflow-wrap: anywhere; line-height: 1.45; }
  .task.done .title { color: var(--muted); text-decoration: line-through; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; font-size: 13px; color: var(--muted); margin-top: 2px; }
  .mchip { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; padding: 0; min-height: 0; color: inherit; font-size: inherit; border-radius: 0; }
  .mchip .ic { width: 14px; height: 14px; }
  button.mchip:hover { color: var(--text); }
  .drop-btn { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: var(--card); color: var(--muted); border-radius: 999px; padding: 4px 12px; font-size: 13px; min-height: 0; margin-right: 4px; }
  .drop-btn .ic { width: 16px; height: 16px; }
  .sheet-item.drop-item { color: var(--muted); }
  .task.dropped .title { text-decoration: line-through; color: var(--faint); }
  .task.dropped .ring { background: transparent !important; border-style: dashed; }
  .dropped-chip { color: var(--faint); font-weight: 600; }
  .mchip.late { color: var(--muted); }
  .mchip.today { color: var(--ok); font-weight: 600; }
  .mchip.sun { color: var(--warn); }
  .acts { display: flex; opacity: 0; margin: -6px 0; }
  .task:hover .acts, .task.sel .acts, .task:focus-within .acts { opacity: 1; }
  .acts .icon-btn.on { color: var(--warn); }
  @media (hover: none) { .acts { display: none; } }

  /* ======================= 今日 ======================= */
  .plan { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
  .plan .meter { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .plan .fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width .4s ease; }
  .plan.over .fill { background: var(--danger); }
  .plan-text { font-size: 13px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .plan.over .plan-text { color: var(--danger); font-weight: 600; }
  .pill-btn {
    display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 6px 14px; min-height: 36px;
    background: var(--accent-soft); border: 0; color: var(--accent); font-weight: 700; font-size: 14px;
  }
  .pill-btn .ic { width: 18px; height: 18px; }
  .nudge { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 14px; color: var(--muted); }
  .nudge .ic { width: 18px; height: 18px; }
  /* タイムライン（縦軸は時刻に固定。1 分 = 2px） */
  .timeline { position: relative; margin: 10px 0 8px; --gut: 50px; }
  .tl-hour { position: absolute; left: 0; right: 0; height: 0; border-top: 1px solid var(--line); }
  .tl-hour span { position: absolute; left: 0; width: calc(var(--gut) - 8px); top: -8px; text-align: right; font-size: 13px; color: var(--faint); background: var(--bg); padding-right: 4px; font-variant-numeric: tabular-nums; }
  .tl-item {
    position: absolute; box-sizing: border-box; overflow: hidden;
    top: 0; left: calc(var(--gut) + (100% - var(--gut)) * var(--lane) / var(--lanes)); width: calc((100% - var(--gut)) / var(--lanes) - 3px);
    border-radius: 8px; border-left: 4px solid var(--col); background: color-mix(in srgb, var(--col) 12%, var(--card));
    display: flex; flex-direction: column; padding: 2px 6px 2px 4px; border-bottom: 2px solid var(--bg);
  }
  .tl-item.done { opacity: .5; }
  .tl-time { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; line-height: 1.3; padding-left: 4px; }
  .tl-time small { font-size: 13px; }
  .tl-time small::before { content: "–"; }
  .tl-item .tasks { min-width: 0; }
  .tl-item .task-inner { padding-top: 2px; padding-bottom: 2px; min-height: 0; background: transparent; }
  .tl-item .task-inner::before { display: none; }
  .tl-item .check { margin-top: 0; }
  .tl-item .task .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tl-item.sm .task .meta, .tl-item.xs .task .meta { display: none; }
  .tl-item.xs { flex-direction: row; align-items: center; gap: 4px; padding-top: 0; padding-bottom: 0; }
  .tl-item.xs .tl-time small { display: none; }
  .tl-item.xs .tasks, .tl-item.xs .ev-card, .tl-item.xs .pp-card { flex: 1; }
  .tl-item .ev-card { padding: 2px 0; gap: 6px; }
  .tl-item .ev-card > .ic { width: 16px; height: 16px; margin: 1px 0 0 2px; }
  .tl-item .ev-card .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tl-item.sm .ev-card .meta, .tl-item.xs .ev-card .meta, .tl-item.xs .ev-card > .ic { display: none; }
  .tl-item.pp { background: var(--bg); border: 1.5px dashed var(--col); border-left: 4px dashed var(--col); }
  .tl-item .pp-card.pp-row { display: flex; margin: 0; padding: 0; border: 0; border-radius: 0; flex-wrap: wrap; align-items: center; }
  .tl-item .pp-card .tasks { flex: 1 1 140px; }
  .tl-item .pp-foot { display: flex; align-items: center; gap: 4px; margin-left: auto; padding-left: 4px; }
  .tl-item:not(.sm):not(.xs) .pp-foot { flex-basis: 100%; }
  .tl-item.sm .pp-why, .tl-item.xs .pp-why, .tl-item.xs .pp-tag { display: none; }
  .tl-item.sm .pp-card.pp-row, .tl-item.xs .pp-card.pp-row { flex-wrap: nowrap; }
  .tl-item.sm .pp-btn, .tl-item.xs .pp-btn { width: 26px; height: 26px; }
  .tl-gap { position: absolute; left: var(--gut); right: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--faint); pointer-events: none; }
  .tl-gap span { background: var(--bg); padding: 0 6px; }
  .tl-now { position: absolute; left: 0; right: 0; height: 0; z-index: 3; pointer-events: none; color: var(--danger); font-weight: 700; font-size: 13px; }
  .tl-now span { position: absolute; left: 0; width: calc(var(--gut) - 8px); top: -8px; text-align: right; background: var(--bg); padding-right: 4px; font-variant-numeric: tabular-nums; }
  .tl-now .bar { position: absolute; left: var(--gut); right: 0; top: -1px; height: 2px; background: var(--danger); border-radius: 1px; }
  .tl-now .bar::before { content: ""; position: absolute; left: -5px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--danger); }
  /* 空のとき */
  .empty { color: var(--muted); text-align: center; padding: 40px 16px 24px; font-size: 15px; }
  .empty svg { width: 120px; height: 120px; display: block; margin: 0 auto 14px; }
  .empty b { display: block; color: var(--text); font-size: 18px; margin-bottom: 4px; }
  .empty .pill-btn { margin-top: 16px; }

  /* ======================= 予定（週の帯） ======================= */
  .week { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 4px -16px 0; padding: 4px 16px 8px; scroll-snap-type: x proximity; }
  .week::-webkit-scrollbar { display: none; }
  .day-chip {
    flex: none; width: 48px; min-height: 0; border-radius: 14px; border: 1px solid var(--line); background: var(--card);
    display: flex; flex-direction: column; align-items: center; padding: 6px 0 5px; gap: 1px; font-size: 12px; color: var(--muted);
    scroll-snap-align: start;
  }

};

const vault = (() => {
  const open = () => new Promise((ok, ng) => {
    const r = indexedDB.open('todo', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => ok(r.result);
    r.onerror = () => ng(r.error);
  });
  const run = (mode, fn) => open().then((db) => new Promise((ok, ng) => {
    const tx = db.transaction('kv', mode);
    const req = fn(tx.objectStore('kv'));
    tx.oncomplete = () => { db.close(); ok(req.result); };
    tx.onerror = tx.onabort = () => { db.close(); ng(tx.error); };
  }));
  return {
    get: (k) => run('readonly', (o) => o.get(k)).catch(() => null),
    set: (k, v) => run('readwrite', (o) => o.put(v, k)).catch(() => {}),
    del: (k) => run('readwrite', (o) => o.delete(k)).catch(() => {}),
  };

  const e = document.createElement(tag);
  if (props) {
    for (const [k, v] of Object.entries(props)) {
      if (v == null || v === false) continue;
      if (k === 'class') e.className = v;
      else if (k === 'value') e.value = v;
      else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
      else if (typeof v === 'boolean' && k in e) e[k] = v;
      else e.setAttribute(k, v === true ? '' : String(v));

  }

function renderMain(d, T, model) {
  const c = $('content');
  const act = d.todos.filter((t) => !t.done);
  const Td = parseYmd(T);
  const nodes = [];
  let title = '', sub = '', extra = null;

  switch (view.type) {
    case 'today': {
      title = '今日'; sub = fmtFull(T) + (holidayName(T) ? `　${holidayName(T)}` : '');

      const doneToday = d.todos.filter((t) => t.done && !t.dropped && t.doneAt && localYmd(t.doneAt) === T).sort((a, b) => cmp(b.doneAt, a.doneAt));
      // 進み具合はタスクとルーティンを合わせて数える
      const rDay = routineDay();
      const rList = routinesFor(d, rDay);
      const rDone = rList.filter((r) => routineDone(d, rDay).has(r.id)).length;
      const total = list.length + doneToday.length + rList.length;
      const doneN = doneToday.length + rDone;
      if (total) extra = h('div', { class: 'ring-sm', title: `今日 ${doneN}/${total} 完了（ルーティンを含む）` }, `${doneN}/${total}`, ringSvg(doneN / total, 44, 5));
      const evs = eventsOn(T);
      nodes.push(tipCard(), deadlineCard(T), mailCard(d, T), routineSection(d, T), foodSection(d, T), planBar(list, d, T, evs));
      if (evs.allDay.length) {
        nodes.push(h('div', { class: 'allday', 'aria-label': '終日の予定' }, evs.allDay.map((ev) =>
          h('a', { class: 'ad-chip', href: gcalDayUrl(T), target: '_blank', rel: 'noopener noreferrer', style: `--col:${calColor(ev.cal)}`, title: 'Google カレンダーで開く' }, ev.title))));
      }
      const inboxN = act.filter((t) => isInbox(t, T)).length;
      if (inboxN) {
        nodes.push(h('div', { class: 'nudge' }, icon('inbox'), `受信箱に未整理が ${inboxN} 件`,
          h('button', { class: 'link-btn', type: 'button', onclick: () => setView({ type: 'inbox' }) }, '整理する')));
      }
      // 今日の提案があるタスクはタイムラインに出す（下の一覧とは重ねない）
      const props = liveProposals(d, T).filter((p) => p.date === T);
      const proposed = new Set(props.map((p) => p.t.id));
      const late = list.filter((t) => isLate(t, T) && !proposed.has(t.id)).sort(byDefault);
      const rest = list.filter((t) => !isLate(t, T) && !proposed.has(t.id));
      const timed = rest.filter((t) => t.time).sort(byDay);
      const untimed = rest.filter((t) => !t.time).sort(byDay);
      if (late.length) {
        nodes.push(group('持ち越し', late, T, {
          cls: 'late', plan: true,
          action: h('button', { class: 'link-btn', type: 'button', onclick: () => moveToToday(late) }, 'すべて今日に'),
        }));
      }
      const hasTl = timed.length || evs.timed.length || props.length;
      if (hasTl) {
        nodes.push(h('section', { class: 'group' },
          h('div', { class: 'group-h' }, h('h3', null, 'タイムライン'), h('span', { class: 'sp' }),
            props.length > 1 ? h('button', { class: 'link-btn', type: 'button', onclick: () => acceptProposals(props) }, `提案 ${props.length} 件を承認`) : null),
          timeline(timed, evs.timed, T, props)));
      }
      if (untimed.length) nodes.push(group(hasTl ? '時間未定' : late.length ? '今日' : 'タスク', untimed, T, { plan: true }));
      if (!list.length && !props.length) {
        nodes.push(doneToday.length
          ? emptyState('done', '今日のタスクはすべて完了', 'おつかれさまでした。')
          : emptyState('today', '今日のタスクはまだありません', '「計画」から今日やることを選ぶか、＋ で追加しましょう。'));
      }
      if (doneToday.length) {
        nodes.push(h('section', { class: 'group' },

      for (let i = 1; i <= 14; i++) {
        const dd = addDays(Td, i);

        }, WD[dd.getDay()], h('b', null, String(dd.getDate())), h('span', { class: 'dot' })));
      }
      nodes.push(strip);
      for (let i = 1; i <= 14; i++) {

        const evList = evRows(eventsOn(k), k);

          id: 'day-' + k, pre: evList || ppList ? h('div', null, evList, ppList) : null,

      const urg = (t) => (!!t.due && t.due <= tom) || t.myDay === T;

  ].filter(Boolean), (fail) => {

function weightCard(d, day) {
  const N = 30;
  const Td = parseYmd(day);
  const pts = [];
  for (let i = N - 1; i >= 0; i--) {
    const k = ymd(addDays(Td, -i));
    const kg = (d.weightLog || {})[k];
    if (Number.isFinite(kg)) pts.push({ i: N - 1 - i, k, kg });
  }
  const head = h('div', { class: 'row' }, h('div', { class: 'chart-h', style: 'flex:1;margin:0' }, `体重（直近 ${N} 日）`),
    h('button', { class: 'link-btn', type: 'button', onclick: () => openWeight(day) }, '記録する'));
  if (!pts.length) return h('div', { class: 'card' }, head, h('p', { class: 'hint' }, '体重を記録すると、ここに推移が出ます'));
  const kgs = pts.map((p) => p.kg);
  const lo = Math.floor(Math.min(...kgs) - 0.5), hi = Math.ceil(Math.max(...kgs) + 0.5);
  const X = (i) => (i / (N - 1)) * 100, Y = (kg) => ((hi - kg) / (hi - lo)) * 100;

  const diff = week ? Math.round((last.kg - week.kg) * 10) / 10 : null;
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');

  svg.setAttribute('aria-hidden', 'true');
  const pl = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');

  svg.append(pl);
  return h('div', { class: 'card' }, head,
    h('div', { class: 'wt-now' }, h('b', null, `${g1(last.kg)} kg`), ` ${fmtShort(last.k)}`, diff != null ? h('span', { class: 'hint' }, `　1 週間前から ${diff > 0 ? '+' : diff < 0 ? '−' : '±'}${g1(Math.abs(diff))} kg`) : null),
    h('div', { class: 'wchart', role: 'img', 'aria-label': `体重の推移: ${pts.map((p) => `${fmtShort(p.k)} ${g1(p.kg)}kg`).join('、')}` },
      h('span', { class: 'yl', style: 'top:0' }, String(hi)), h('span', { class: 'yl', style: 'top:100%' }, String(lo)), svg,
      pts.map((p) => h('span', { class: 'dot', style: `left:${X(p.i)}%;top:${Y(p.kg)}%`, 'data-tip': `${fmtShort(p.k)}  ${g1(p.kg)} kg` }))),
    h('div', { class: 'wc-x', 'aria-hidden': 'true' }, h('span', null, fmtShort(ymd(addDays(Td, -(N - 1))))), h('span', null, fmtShort(day))));
}

  const now = input.now;
  const today = ymd(now);
  const nowMin = minOfDay(now, parseYmd(today));
  const prevItems = ((input.prev && input.prev.items) || []).filter((p) => p && typeof p.taskId === 'string' && YMD_RE.test(p.date) && HM_RE.test(p.start || '') && HM_RE.test(p.end || ''));

    const date = addDays(parseYmd(today), i);
    const k = ymd(date);
    const next = addDays(date, 1);
    const dayEvents = events.filter((e) => (e.allDay ? ymd(e.start) <= k && k < ymd(e.end) : e.start < next && e.end > date));
    const labEv = dayEvents.find((e) => has(e.title, R.labWords));
    const offEv = dayEvents.find((e) => e.allDay && has(e.title, R.offWords));
    const hol = (input.holidays && input.holidays[k]) || '';
    let start = (labEv ? R.labDayStart : R.dayStart) * 60;
    // 睡眠の記録: 朝は起きた時刻から、夜は寝る時刻の sleepGap 分前まで

      eventMin += f - s;

      start, freeFrom, end, free: [], load: 0, deep: 0,
      physical: dayEvents.some((e) => has(e.title, R.physicalWords)),
      budget: Math.max(0, cap - eventMin),
    };
    // 日時が決まっているタスクも埋まっている時間として扱う
    for (const t of active) {
      if (t.due !== k || !HM_RE.test(t.time || '')) continue;
      const s = hmToMin(t.time);
      const d = t.estimate || 30;
      busy.push([s - R.buffer, s + d + R.buffer]);
      day.load += d;
      if (kindOf(t) === 'deep') day.deep += d;
      if (kindOf(t) === 'physical') day.physical = true;

  // 「見送り」（planSkipUntil）は、その日までを避けるだけで、次の日以降には提案する
  const skipped = (t, k) => !!t.planSkipUntil && k <= t.planSkipUntil;
  const allowedDays = (t) => {
    let list;
    if (t.myDay === today) list = [days[0]];
    else if (t.repeat && t.due && t.due >= today) list = dayOf[t.due] ? [dayOf[t.due]] : [];
    else if (t.due && t.due >= today) list = days.filter((d) => d.k <= t.due);

      && !(t.repeat && t.due && t.due > lastDay) // 繰り返しの次の回がまだ先
      && !(t.myDay === today && skipped(t, today)))
    .sort((a, b) => group(a) - group(b) || cmp(a.due || '~', b.due || '~') || prio(a) - prio(b) || cmp(a.createdAt || '', b.createdAt || '') || cmp(a.id, b.id));

    if (kind === 'errand' && day.holiday) return false; // 祝日は役所や窓口が閉まっているので外出・用事は入れない
    if (t.place === 'home' && day.isLab && s < R.eveningStart * 60) return false;

    else if (t.due) r.push('締切 ' + mdLabel(t.due));
    if (kindOf(t) === 'deep' && s + dur <= R.goldenEnd * 60) r.push('頭が冴えている朝に（深い思考）');
    if (t.place === 'lab') r.push(`研究室の日（${day.labWord}）`);
    if (t.place === 'home') r.push('自宅にいる時間');
    if (kindOf(t) === 'physical') r.push('体を動かすのは 1 日 1 回');
    if (s >= R.eveningStart * 60) r.push('夕方以降は軽い作業');
    const ratio = ratios[kindOf(t)] || ratios.all;
    if (ratio && Math.abs(ratio - 1) >= 0.15) r.push(`実績から見積もりの ${ratio.toFixed(1)} 倍で確保`);
    if (mode === 'over') r.push('1 日の作業量を超えますが期限のため');
    return r.join(' · ') || '空いている時間';
  };
  const items = [];

    day.load += dur;
    if (kindOf(t) === 'deep') day.deep += dur;
    if (kindOf(t) === 'physical') day.physical = true;
    items.push({ taskId: t.id, date: day.k, start: minToHm(s), end: minToHm(e), reason: reasonFor(t, day, s, dur, mode) });
  };
  // 前回の提案がまだ有効なら、その時刻のまま残す
  const prevBy = {};
  for (const p of prevItems) prevBy[p.taskId] = p;
  const keep = (t) => {
    const p = prevBy[t.id];
    const day = p && dayOf[p.date];
    if (!day || !allowedDays(t).includes(day)) return false;
    const dur = durOf(t);
    const s = hmToMin(p.start);
    const running = day === days[0] && s >= day.freeFrom && s + dur > nowMin; // 進行中
    if ((s < day.start && !running) || s + dur !== hmToMin(p.end) || !day.free.some((f) => f[0] <= s && s + dur <= f[1])) return false;

    const kind = kindOf(t);
    const modes = kind === 'deep' ? ['golden', 'normal'] : kind === 'shallow' || kind === 'errand' ? ['late', 'normal'] : ['normal'];
    if (t.myDay === today || (t.due && t.due <= lastDay)) modes.push('over');
    for (const mode of modes) {
      // 空きの途中から始めてよい（朝を避ける・研究室の日の「自宅で」は夕方から）
      const from = Math.max(mode === 'late' ? R.goldenEnd * 60 : 0, 0);
      for (const day of dlist) {
        const lo = Math.max(from, day.start, t.place === 'home' && day.isLab ? R.eveningStart * 60 : 0);
        for (const f of day.free) {
          const s = Math.max(f[0], lo);
          if (s + dur <= f[1] && fits(t, day, s, s + dur, mode)) { place(t, day, s, dur, mode); return; }
        }
      }
    }
    const why = !dlist.length ? '見送り中'
      : t.place === 'lab' && !dlist.some((d) => d.isLab) ? '研究室の日がありません'
        : t.myDay === today && days[0].off ? `今日は提案しない日です（${days[0].off}）`
        : t.myDay === today ? `今日は ${dur} 分の空きがありません`
          : t.due && t.due >= today ? `${mdLabel(t.due)} までに ${dur} 分の空きがありません`
            : `${R.days} 日以内に ${dur} 分の空きがありません`;
    unplaced.push({ taskId: t.id, reason: why });
  };
  // 「今日やる」と期限切れを先に。その中でも前回の提案を優先し、次に残りのタスク
  const urgent = cands.filter((t) => group(t) <= 1);
  const others = cands.filter((t) => group(t) > 1);
  for (const list of [urgent, others]) list.filter((t) => !keep(t)).forEach(fill);

  items.sort((a, b) => cmp(a.date + a.start, b.date + b.start));
  const nToday = items.filter((x) => x.date === today).length;
  return {
    items, unplaced,
    summary: items.length || unplaced.length
      ? `${items.length} 件を提案（今日 ${nToday} 件）${unplaced.length ? `。入らなかったもの ${unplaced.length} 件` : ''}`
      : '提案するタスクはありません',

}
let PLAN = { items: [], unplaced: [], summary: '', on: false };

const suggestOn = () => DATA.meta.suggest !== false;

  if (!cfg || !suggestOn()) { PLAN = { items: [], unplaced: [], summary: '', on: false }; return; }
  if (planPrev === undefined) {
    const c = loadJSON(KEY.planPrev, null);
    planPrev = c && c.key === cfgKey() && Array.isArray(c.items) ? { items: c.items } : null;
  }
  const valid = (e) => !isNaN(e.start) && !isNaN(e.end);
  const events = [...CAL.events, ...queuedEvents()].map((ev) => (ev.allDay
    ? { title: ev.title, start: parseYmd(ev.start), end: parseYmd(ev.end), allDay: true }
    : { title: ev.title, start: new Date(ev.start), end: new Date(ev.end), allDay: false })).filter(valid);
  const sleep = CAL.sleep.map((x) => ({ start: new Date(x.start), end: new Date(x.end) })).filter(valid);
  const holidays = {};
  for (let i = 0; i < 15; i++) { const k = ymd(addDays(new Date(), i)); if (holidayName(k)) holidays[k] = holidayName(k); }
  const p = planSchedule({ now: new Date(), todos: DATA, events, sleep, holidays, prev: planPrev, rules: planRules(DATA.meta) });

// まだ使える提案（承認・完了・見送り・時間が過ぎたもの、アプリで日付を前にしたものは出さない）
function liveProposals(d, T) {

    const t = d.todos.find((x) => x.id === p.taskId);
    if (!t || t.done || t.someday || t.time || p.date < T || (p.date === T && p.end <= nowHm)) continue;
    if (t.planSkipUntil && t.planSkipUntil >= p.date) continue;

}
function acceptProposals(list) {

  mutate(list.map((p) => ({ t: 'patch', id: p.t.id, set: {
    due: p.date, time: p.start, someday: false, ...(p.t.estimate ? {} : { estimate: hmToMin(p.end) - hmToMin(p.start) }),
  } })));

const proposalButtons = (p) => [

  h('button', { class: 'pp-btn', type: 'button', title: 'この日は見送る', 'aria-label': `見送る: ${p.t.title}`, onclick: () => skipProposal(p) }, icon('x')),

      h('div', { class: 'title' }, h('span', { class: 'pp-tag' }, icon('sparkle'), '提案'), withWhen ? h('span', { class: 'pp-when' }, withWhen) : null, p.t.title),

const CAL_COLORS = ['var(--c7)', 'var(--c3)', 'var(--c5)', 'var(--c4)', 'var(--c1)', 'var(--c2)'];

  return c && /^#[0-9a-f]{6}$/i.test(c.color) ? c.color : CAL_COLORS[Math.max(0, i) % CAL_COLORS.length]; // Google カレンダーの色があれば使う
}

// その日の予定（終日 / 時刻あり）。日をまたぐ予定はその日の分だけに切る
// アプリから追加して、まだ Google カレンダーに作られていない予定（送信待ち・作れなかったもの）

    .map((x) => ({ id: 'q-' + x.id, qid: x.id, title: x.title, start: x.start, end: x.end, allDay: !!x.allDay, cal: x.cal, location: x.location, queued: x.status === 'error' ? 'error' : 'pending', error: x.error }));

  const out = { allDay: [], timed: [] };

    const s = new Date(ev.start);

    if (day < sd || day > ed) continue;
    const sm = sd === day ? s.getHours() * 60 + s.getMinutes() : 0;
    const em = ed === day && ymd(e) === day ? e.getHours() * 60 + e.getMinutes() : 1440;
    out.timed.push({ ...ev, sm, em: Math.max(em, sm) });

const hmEnd = (m) => (m >= 1440 ? '24:00' : minToHm(m));
function evRows(evs, day) {

    h('span', { class: 't' }, when), h('span', { class: 'd' }), h('span', { class: 'n' }, ev.title), ev.location ? h('span', { class: 'l' }, ev.location) : null);

// 「計画」ボタンと、見積もりの合計 / 作業に使える時間（1 日の作業可能時間 − カレンダーの予定）を 1 段にまとめる

// 時刻のあるタスクとカレンダーの予定を、時間の長さどおりの高さで 1 日の流れとして並べる

  let cluster = [];
  let clusterEnd = -1;
  const flush = () => {
    const lanes = [];
    for (const e of cluster) {
      let k = lanes.findIndex((end) => end <= e.start);
      if (k < 0) { k = lanes.length; lanes.push(0); }
      lanes[k] = e.end;
      e.lane = k;
    }
    for (const e of cluster) e.lanes = lanes.length;
    cluster = [];
  };
  for (const e of entries) {
    if (e.start >= clusterEnd) flush();
    cluster.push(e);
    clusterEnd = Math.max(clusterEnd, e.end);
  }
  flush();

  const out = [];
  for (let m = lo; m <= hi; m += 60) out.push(h('div', { class: 'tl-hour', style: `top:${y(m)}px`, 'aria-hidden': 'true' }, h('span', null, minToHm(m % (24 * 60)))));
  const nowLine = () => h('div', { class: 'tl-now', style: `top:${y(nowMin)}px`, 'aria-label': '現在時刻' }, h('span', null, minToHm(nowMin)), h('div', { class: 'bar' }));
  let nowDone = !showNow;

      out.push(h('div', { class: 'tl-gap', style: `top:${y(prevEnd)}px;height:${(start - prevEnd) * TL_PX}px` }, h('span', null, `空き ${fmtMin(start - prevEnd)}`)));
    }

        time(minToHm(start), hmEnd(end)),
        h('a', { class: 'ev-card', href: gcalDayUrl(T), target: '_blank', rel: 'noopener noreferrer', title: 'Google カレンダーで開く' },
          icon('calendar'),
          h('div', { class: 'body' },
            h('div', { class: 'title' }, ev.title),
            h('div', { class: 'meta' }, h('span', { class: 'mchip' }, calName(ev.cal)), ev.location ? h('span', { class: 'mchip' }, ev.location) : null)))));
      continue;
    }
    if (p) {
      // 今日の提案は、ふつうのタスクの行（丸で完了・スワイプ・タップで詳細）に、理由と ✓ × を添える
      out.push(h('div', { class: 'tl-item pp' + size(e), style: `${place(e)};--col:${taskColor(p.t)}`, title: p.reason },
        time(p.start, p.end),
        h('div', { class: 'pp-card pp-row', 'data-prop': p.t.id },
          h('ul', { class: 'tasks' }, taskRow(p.t, T, { plan: true, hideDate: true })),
          h('div', { class: 'pp-foot' }, h('span', { class: 'pp-tag' }, icon('sparkle'), '提案'), h('span', { class: 'pp-why' }, p.reason), ...proposalButtons(p)))));
      continue;
    }
    out.push(h('div', { class: 'tl-item' + (t.done ? ' done' : '') + size(e), style: `${place(e)};--col:${taskColor(t)}` },
      time(t.time, minToHm(end)),
      h('ul', { class: 'tasks' }, taskRow(t, T, { plan: true, hideDate: true }))));
  }
  if (!nowDone) out.push(nowLine());
  return h('div', { class: 'timeline', style: `height:${(hi - lo) * TL_PX}px` }, out);
}

function statsCard(d, T) {
  const Td = parseYmd(T);
  const count = new Map();
  for (const t of d.todos) if (t.done && !t.dropped && t.doneAt) { const k = localYmd(t.doneAt); count.set(k, (count.get(k) || 0) + 1); }
  const mon = ymd(mondayOf(Td));
  let week = 0;
  for (const [k, v] of count) if (k >= mon && k <= T) week += v;
  let streak = 0;
  for (let cur = count.get(T) ? Td : addDays(Td, -1); count.get(ymd(cur)); cur = addDays(cur, -1)) streak++;
  const days = [];
  for (let i = 13; i >= 0; i--) { const k = ymd(addDays(Td, -i)); days.push({ k, v: count.get(k) || 0 }); }
  const max = Math.max(1, ...days.map((x) => x.v));
  return h('div', { class: 'card' },
    h('div', { class: 'stats' },
      stat(String(count.get(T) || 0), '今日の完了'), stat(String(week), '今週の完了'),
      stat(`${streak}日`, '連続で完了'), stat(fmtMin(focusMinutes(d, (k) => k >= mon && k <= T)), '今週の集中')),
    h('div', { class: 'chart' },

      h('div', { class: 'bars', role: 'img', 'aria-label': '直近14日の完了数: ' + days.map((x) => `${fmtShort(x.k)} ${x.v}件`).join('、') },

          x.k === T && x.v ? h('span', { class: 'bar-val' }, String(x.v)) : null,
          h('div', { class: 'bar', style: `height:${x.v / max * 100}%` })))),
      h('div', { class: 'bar-labels', 'aria-hidden': 'true' },
        days.map((x, i) => h('span', null, (13 - i) % 2 === 0 ? String(parseYmd(x.k).getDate()) : '')))));

function autoGrow(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }
const qaTokens = () => $('qaInput').value.split(/[\s\u3000]+/).filter(Boolean);

function cyclePriority() {

function taskFromQuick(text) {

/* ---------- 今日の計画（Microsoft To Do の「提案」風） ---------- */
function planSuggestions(d, T) {
  const soon = ymd(addDays(parseYmd(T), 3));
  const cand = d.todos.filter((t) => !t.done && !t.someday && t.myDay !== T && !(t.due && t.due <= T));
  const soonL = cand.filter((t) => t.due && t.due <= soon).sort((a, b) => cmp(a.due, b.due) || byDefault(a, b));
  const imp = cand.filter((t) => !t.due && (t.priority === 1 || t.priority === 2)).sort(byDefault);
  const inbox = cand.filter((t) => isInbox(t, T) && !imp.includes(t)).sort((a, b) => cmp(b.createdAt, a.createdAt)).slice(0, 10);
  return [['近いうちに期限', soonL], ['優先度が高い', imp], ['受信箱から', inbox]].filter((g) => g[1].length);
}

 * ========================================================================= */
const findTask = (id) => DATA.todos.find((x) => x.id === id);

  if (!t) return;
  const snap = clone(t);
  const T = todayYmd();
  if (t.done) {
    mutate({ t: 'patch', id, set: { done: false, doneAt: null, dropped: false } });
    toast('未完了に戻しました', { t: 'restore', tasks: [snap] });
    return;
  }
  if (t.repeat && t.due) {
    const next = nextDue(t.due, t.repeat, T);
    const logId = uid();
    mutate({ t: 'complete', id, from: t.due, next, logId });
    toast(`完了 · 次回は ${fmtDate(next, T)}`, { t: 'restore', tasks: [snap], remove: [logId] });
  } else {
    mutate({ t: 'complete', id });
    toast(`「${t.title}」を完了しました`, { t: 'restore', tasks: [snap] });
  }
  if (view.type === 'today' && isToday(snap, T) && !DATA.todos.some((x) => isToday(x, T))) celebrate();
}
// 完了は、チェックが付く → 行が消える、の順に少し時間をかけて見せる
const completing = new Set();
function completeTask(id, el) {
  const t = findTask(id);
  if (!t || completing.has(id)) return;
  if (t.done) return toggleDone(id);
  el = el || document.querySelector(`#content .task[data-id="${CSS.escape(id)}"]`);
  playDone();
  haptic();
  if (!el || reduceMotion()) return toggleDone(id);
  completing.add(id);
  el.classList.add('completing');
  setTimeout(() => {
    el.style.height = el.offsetHeight + 'px';
    void el.offsetHeight;
    el.classList.add('leaving');
    setTimeout(() => { completing.delete(id); toggleDone(id); }, 240);
  }, 360);
}

  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

  for (let i = 0; i < 70; i++) {

/* =========================================================================
 * 初回設定・接続
 * 設定画面には文字を出さない。失敗したら怪しい欄を赤枠にし、詳細はコンソールにだけ出す
 * ========================================================================= */
const FIELDS = ['repo', 'token'];
// 「owner/repo/ファイル」を分ける。ファイルを省くと todos.json。GitHub の URL を貼っても受け付ける
function parseTarget(v) {
  let parts = v.trim().replace(/^https?:\/\/github\.com\//, '').split('/').filter(Boolean);
  if (['blob', 'tree'].includes(parts[2])) parts = [...parts.slice(0, 2), ...parts.slice(4)];
  if (parts.length < 2 || !parts.slice(0, 2).every((x) => /^[\w.-]+$/.test(x))) return null;
  return { repo: parts.slice(0, 2).join('/'), path: parts.slice(2).join('/') || 'todos.json' };
}
function showSetup(bad = [], detail) {
  document.title = '';
  $('app').hidden = true;
  for (const id of ['focusBar', 'focus', 'toast', 'sheet', 'backdrop', 'detail']) $(id).hidden = true;
  $('setup').hidden = false;
  for (const id of FIELDS) $(id).classList.toggle('bad', bad.includes(id));
  if (detail) console.warn(detail);
}
function badFields(e) {
  if (e instanceof TypeError) return FIELDS; // 通信できない

  if (e.status === 404) return ['repo', 'token']; // 名前違い、またはトークンの対象外
  return FIELDS;
}
async function connect() {
  const target = parseTarget($('repo').value);
  const token = $('token').value.trim();
  const bad = [];
  if (!target) bad.push('repo');
  if (!token) bad.push('token');
  if (bad.length) return showSetup(bad);
  const { repo, path } = target;
  cfg = { token, repo, path };
  $('setup').classList.add('busy');
  try {
    const info = await gh('GET', `/repos/${repo}`);
    if (!info.private) {
      cfg = null;
      return showSetup(['repo'], '公開リポジトリには接続しない');
    }
    saveLogin(cfg);
    rememberLogin($('repo').value.trim(), token);
    await showApp(); // 入力欄が消えるので、ブラウザが「パスワードを保存しますか？」と聞く
    $('token').value = '';
  } catch (e) {
    cfg = null;
    showSetup(badFields(e), explain(e));
  } finally {
    $('setup').classList.remove('busy');
  }
}

  try { if (window.PasswordCredential) navigator.credentials.store(new PasswordCredential({ id, password, name: 'Todo' })).catch(() => {}); } catch {}

}

  } catch (e) {
    if (e.status === 401) return reauth(explain(e));
    setSync(e instanceof TypeError ? 'offline' : 'error', e);
  }
}
function logout(bad, detail) {
  for (const k of [KEY.token, KEY.cache, KEY.pending, KEY.timer, KEY.cal, KEY.planPrev, KEY.portal, KEY.news, KEY.mail, KEY.mailKey]) store.del(k);
  vault.del('login');
  setCal(null, 'none');
  setPortal(null, 'none');
  setNews(null, 'none');
  setMail(null, 'none');
  MAILBOX = { state: 'none', items: [], accounts: {}, updatedAt: null, enc: null };
  planPrev = undefined;
  cfg = null;
  Object.assign(st, { base: null, sha: null, loaded: false, pending: [], syncing: false });
  clearTimeout(st.timer);
  timer = null;
  closeDetail();
  closeSheet();
  closeFocusMode();
  $('content').replaceChildren();
  showSetup(bad || [], detail);
}

/* =========================================================================
 * イベント
 * ========================================================================= */
$('setup').addEventListener('submit', (ev) => ev.preventDefault());
$('setup').addEventListener('submit', () => { if (!$('setup').classList.contains('busy')) connect(); });
// 保存したパスワード（キーチェーンなど）で 2 つの欄が埋まったら、Enter を待たずに接続する。
// 同じ値で失敗したときは繰り返さない
let autoTried = '';
let autoTimer = 0;
function autoConnect() {
  clearTimeout(autoTimer);
  autoTimer = setTimeout(() => {
    const token = $('token').value.trim();
    const key = $('repo').value.trim() + '\n' + token;
    if ($('setup').hidden || $('setup').classList.contains('busy') || key === autoTried) return;
    if (!parseTarget($('repo').value) || !/^(github_pat_\w{40,}|gh[pousr]_\w{30,})$/.test(token)) return;
    autoTried = key;
    connect();
  }, 250);
}
for (const id of FIELDS) {
  $(id).addEventListener('input', () => { $(id).classList.remove('bad'); autoConnect(); });
  $(id).addEventListener('change', autoConnect);
  $(id).addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter' && !ev.isComposing && ev.keyCode !== 229) { // 日本語入力の確定では送らない
      ev.preventDefault();
      // フォームとして送信する（パスワードの保存を提案してもらうため）。送信そのものは止めて、接続だけ行う
      if ($('setup').requestSubmit) $('setup').requestSubmit(); else connect();
    }
  });
}

$('fab').append(icon('plus'));
$('search').before(icon('search'));
$('fab').addEventListener('click', () => {
  unlockAudio();
  if (view.type === 'calendar') openEventSheet({ date: calAnchor && calAnchor >= todayYmd() ? calAnchor : todayYmd() }); // カレンダーでは予定を追加
  else openQuickAdd();
});
$('backdrop').addEventListener('click', () => { if (sheetKind === 'zt' && ztActive()) return; closeSheet(); }); // タイマーの途中は × で閉じる
$('search').addEventListener('input', (e) => onSearch(e.target.value));
$('helpBtn').append(icon('help'));
$('settingsBtn').append(icon('gear'));
$('retryBtn').append(icon('sync'));
$('helpBtn').addEventListener('click', openHelp);
$('settingsBtn').addEventListener('click', openSettings);
const retry = () => {
  if (syncErrStatus === 401) return reauth(explain({ status: 401 })); // トークンの問題は入力欄で直す
  return st.pending.length ? sync() : reload(false);
};
$('retryBtn').addEventListener('click', retry);
$('syncPill').addEventListener('click', retry);
$('undoBtn').addEventListener('click', undo);
$('focusBar').addEventListener('click', openFocusMode);
document.addEventListener('pointerdown', unlockAudio, { once: true, capture: true });
window.visualViewport?.addEventListener('resize', trackKeyboard);
window.visualViewport?.addEventListener('scroll', trackKeyboard);

// 行のスワイプ（右 = 完了、左 = 日付を変える）
const SWIPE_T = 72;
const sw = { active: false };
let suppressClick = false;
$('content').addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const inner = e.target.closest('.task-inner');
  if (!inner || e.target.closest('button:not(.body), a, input, textarea, select')) return;
  const li = inner.closest('.task');
  Object.assign(sw, { active: true, decided: false, horizontal: false, el: li, inner, id: li.dataset.id, x0: e.clientX, y0: e.clientY, dx: 0, pid: e.pointerId });
});
document.addEventListener('pointermove', (e) => {
  if (!sw.active || e.pointerId !== sw.pid) return;
  const dx = e.clientX - sw.x0;
  const dy = e.clientY - sw.y0;
  if (!sw.decided) {
    if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
    sw.decided = true;
    sw.horizontal = Math.abs(dx) > Math.abs(dy) * 1.4;
    if (!sw.horizontal) { sw.active = false; return; }
    sw.el.classList.add('swiping');
    try { sw.inner.setPointerCapture(e.pointerId); } catch {}
  }
  sw.dx = dx;
  const lim = sw.el.offsetWidth * 0.6;
  sw.inner.style.transform = `translateX(${Math.max(-lim, Math.min(lim, dx))}px)`;
  sw.el.dataset.dir = dx > 0 ? 'right' : 'left';
  const armed = Math.abs(dx) > SWIPE_T;
  if (armed && !sw.armed) haptic();
  sw.armed = armed;
  sw.el.classList.toggle('arm-done', dx > SWIPE_T);
  sw.el.classList.toggle('arm-sched', dx < -SWIPE_T);
}, { passive: true });
function endSwipe(e, cancelled) {
  if (!sw.active || e.pointerId !== sw.pid) return;
  sw.active = false;
  if (!sw.horizontal) return;
  suppressClick = true;
  setTimeout(() => { suppressClick = false; }, 60);
  const { el, inner, id, dx } = sw;
  sw.armed = false;
  inner.style.transition = 'transform .2s ease';
  inner.style.transform = '';
  setTimeout(() => { inner.style.transition = ''; el.classList.remove('swiping', 'arm-done', 'arm-sched'); }, 200);
  if (cancelled) return;
  if (dx > SWIPE_T) completeTask(id, el);
  else if (dx < -SWIPE_T) openSchedule(id);
}
document.addEventListener('pointerup', (e) => endSwipe(e, false));
document.addEventListener('pointercancel', (e) => endSwipe(e, true));

$('content').addEventListener('click', (e) => {
  if (suppressClick) { suppressClick = false; return; }
  const a = e.target.closest('[data-act]');
  if (!a) return;
  const li = a.closest('.task');
  const id = li && li.dataset.id;
  switch (a.dataset.act) {
    case 'toggle': completeTask(id, li); break;
    case 'drop': dropTask(id); break;
    case 'open': openDetail(id); break;
    case 'myday': toggleMyDay(id); break;
    case 'focus': startFocus(id); break;
    case 'view': setView(JSON.parse(a.dataset.view)); break;
  }
});
function markSel() {
  for (const r of document.querySelectorAll('#content .task')) r.classList.toggle('sel', r.dataset.id === selId);
}
$('content').addEventListener('focusin', (e) => {
  const li = e.target.closest('.task');
  if (li) { selId = li.dataset.id; markSel(); }
});
function moveSel(delta) {
  const rows = [...document.querySelectorAll('#content .task')];
  if (!rows.length) return;
  const i = rows.findIndex((r) => r.dataset.id === selId);
  const next = rows[i < 0 ? (delta > 0 ? 0 : rows.length - 1) : Math.max(0, Math.min(rows.length - 1, i + delta))];
  selId = next.dataset.id;
  markSel();
  next.scrollIntoView({ block: 'nearest' });
}

// キーボード操作
let gWait = false;
document.addEventListener('keydown', (e) => {
  if (!cfg || $('app').hidden) return;
  const el = e.target;
  const typing = el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' || el.isContentEditable;
  if (e.key === 'Escape') {
    if (!$('focus').hidden) closeFocusMode();
    else if (!$('sheet').hidden) closeSheet();
    else if (typing) el.blur();
    else if (detailId) closeDetail();
    else { selId = null; markSel(); }
    return;
  }
  if (!$('sheet').hidden || !$('focus').hidden) return;
  if (typing || e.altKey) return;
  if (e.metaKey || e.ctrlKey) {
    if (e.key === 'z') { e.preventDefault(); undo(); }
    return;
  }
  if ((el.tagName === 'BUTTON' || el.tagName === 'A') && (e.key === ' ' || e.key === 'Enter')) return; // ボタン自体の動作に任せる
  if (gWait) {
    gWait = false;
    const v = { i: 'inbox', t: 'today', u: 'upcoming', a: 'anytime', s: 'someday', m: 'matrix', r: 'review', l: 'logbook' }[e.key];
    if (v) { e.preventDefault(); setView({ type: v }); }
    return;
  }
  const sel = selId && findTask(selId) ? selId : null;
  switch (e.key) {
    case 'g': gWait = true; setTimeout(() => { gWait = false; }, 1500); break;
    case 'n': case 'q': e.preventDefault(); unlockAudio(); openQuickAdd(); break;
    case '/': e.preventDefault(); if (wide()) $('search').focus(); else { setView({ type: 'browse' }); mSearch?.querySelector('input').focus(); } break;
    case 'j': case 'ArrowDown': e.preventDefault(); moveSel(1); break;
    case 'k': case 'ArrowUp': e.preventDefault(); moveSel(-1); break;
    case 'Enter': case 'e': if (sel) { e.preventDefault(); openDetail(sel); } break;
    case 'x': case ' ': if (sel) { e.preventDefault(); completeTask(sel); } break;
    case 't': if (sel) toggleMyDay(sel); break;
    case 's': if (sel) toggleSomeday(sel); break;
    case 'd': if (sel) openSchedule(sel); break;
    case '1': case '2': case '3': case '0': if (sel) setPriority(sel, +e.key); break;
    case 'f': if (sel) startFocus(sel); break;
    case 'Delete': case 'Backspace': if (sel) { e.preventDefault(); deleteTask(sel); } break;
    case 'z': undo(); break;
    case '?': openHelp(); break;
  }
});

// グラフのツールチップ
function showTip(e) {
  const el = e.target.closest && e.target.closest('[data-tip]');
  const tip = $('tip');
  if (!el) { tip.hidden = true; return; }
  tip.textContent = el.dataset.tip;
  tip.hidden = false;
  const r = el.getBoundingClientRect();
  tip.style.left = Math.max(8, Math.min(window.innerWidth - tip.offsetWidth - 8, r.left + r.width / 2 - tip.offsetWidth / 2)) + 'px';
  tip.style.top = Math.max(8, r.top - tip.offsetHeight - 6) + 'px';
}
document.addEventListener('mouseover', showTip);
document.addEventListener('focusin', showTip);
document.addEventListener('scroll', () => { $('tip').hidden = true; }, true);
// 下へスクロールしている間は ＋ を引っ込め、上へ戻すと出す（下のほうの文字に重ならないように）
{
  let lastY = window.scrollY;
  window.addEventListener('scroll', () => {
    const y = window.scrollY;
    if (wide()) { $('fab').classList.remove('away'); lastY = y; return; } // スマホだけ
    if (Math.abs(y - lastY) < 8) return;
    $('fab').classList.toggle('away', y > lastY && y > 80);
    lastY = y;
  }, { passive: true });
}

// 別の端末での変更を拾う・日付が変わったら描き直す
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !cfg) return;
  tick();
  if (st.pending.length) sync(); else reload(true);
  if (Date.now() - CAL.fetchedAt > 5 * 60000) fetchCalendar();
});
setInterval(() => {
  if (!cfg || document.visibilityState !== 'visible') return;
  if (st.pending.length) sync(); else reload(true);
  if (Date.now() - CAL.fetchedAt > 5 * 60000) fetchCalendar(); // 予定は 1 時間ごとにしか変わらないので 5 分おきで十分
  if (renderedDay !== todayYmd() || view.type === 'today') render(); // 今日のタイムラインの現在時刻も進める
}, 60000);
setInterval(tick, 1000);
window.addEventListener('online', () => { if (cfg) sync(); });
window.addEventListener('beforeunload', (ev) => {
  // 未保存の操作は端末に残るので失われないが、送信中だけは念のため確認する
  if (st.syncing) { ev.preventDefault(); ev.returnValue = ''; }
});

/* =========================================================================
 * 起動
 * 初期値は持たない（公開ページに非公開リポジトリの名前を書かないため）。
 * 一度接続した端末では、その端末に保存した値を使う
 * ========================================================================= */
(function init() {
  applyAccent();
  // ホーム画面に追加したときにオフラインでも開けるようにする（GitHub API の通信には関与しない）
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
  const start = (c) => {
    cfg = c;
    $('repo').value = c.path === 'todos.json' ? c.repo : `${c.repo}/${c.path}`;
    showApp();
  };
  const saved = { token: store.get(KEY.token), repo: store.get(KEY.repo), path: store.get(KEY.path) || 'todos.json' };
  if (saved.repo) $('repo').value = saved.path === 'todos.json' ? saved.repo : `${saved.repo}/${saved.path}`;
  try { localStorage.setItem('todo.probe', '1'); localStorage.removeItem('todo.probe'); } catch (e) { console.warn('この画面では端末に保存できません', e); }
  if (validLogin(saved)) {
    start(saved);
    vault.get('login').then((v) => { if (!validLogin(v) || v.token !== saved.token || v.repo !== saved.repo || v.path !== saved.path) saveLogin(saved); });
    return;
  }
  // localStorage が空なら IndexedDB の控えから戻す（少し待っても返事がなければ入力欄を出す）
  let settled = false;
  const fallback = setTimeout(() => { settled = true; showSetup(); }, 1500);
  vault.get('login').then((v) => {
    if (settled) return;
    settled = true;
    clearTimeout(fallback);
    if (validLogin(v)) {
      saveLogin(v);
      start({ token: v.token, repo: v.repo, path: v.path });
    } else {
      showSetup();
    }
  });
})();
</script>
