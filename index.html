<!doctype html>
<html lang="ja" data-accent="blue">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151514" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<!-- 外部スクリプトは一切読み込まない。通信先は GitHub API のみに制限する -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://api.github.com; img-src 'self' data:; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<title></title>
<style>
  /* ======================= 色 ======================= */
  :root {
    color-scheme: light;
    --bg: #f6f6f4; --card: #ffffff; --raise: #ffffff; --sunk: #ecebe8;
    --text: #1b1b19; --muted: #6b6a66; --faint: #a3a29c; --line: #e3e2de;
    --danger: #c63b3a; --ok: #1f9d55; --warn: #c27400;
    --p1: #e34948; --p2: #eb6834; --p3: #2a78d6;
    --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100;
    --c5: #e87ba4; --c6: #008300; --c7: #4a3aa7; --c8: #e34948;
    --accent: #2a78d6; --accent-ink: #ffffff;
    --shadow: 0 12px 40px rgba(0, 0, 0, .16);
    --radius: 14px;
  }
  html[data-accent=green] { --accent: #13895c; }
  html[data-accent=orange] { --accent: #d4581f; }
  html[data-accent=purple] { --accent: #6a4fd8; }
  html[data-accent=pink] { --accent: #cf3f78; }
  html[data-accent=graphite] { --accent: #4a4a46; }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #151514; --card: #1f1f1d; --raise: #292927; --sunk: #0f0f0e;
      --text: #ecebe6; --muted: #a9a8a0; --faint: #74736d; --line: #33322e;
      --danger: #ef6b6a; --ok: #3ccf7a; --warn: #f0a63a;
      --p1: #e66767; --p2: #e2703f; --p3: #3987e5;
      --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
      --c5: #d55181; --c6: #2f9a2f; --c7: #9085e9; --c8: #e66767;
      --accent: #5598e7; --accent-ink: #0b0b0b;
      --shadow: 0 12px 40px rgba(0, 0, 0, .55);
    }
    html[data-accent=green] { --accent: #3cc68a; }
    html[data-accent=orange] { --accent: #f08a50; }
    html[data-accent=purple] { --accent: #9d8bf0; }
    html[data-accent=pink] { --accent: #ec7aa6; }
    html[data-accent=graphite] { --accent: #c9c8c2; }
  }
  :root { --accent-soft: color-mix(in srgb, var(--accent) 14%, transparent); }

  /* ======================= 基本 ======================= */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text); -webkit-text-size-adjust: 100%;
    font: 16px/1.5 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  /* iOS は 16px 未満の入力欄にフォーカスすると拡大するので 16px にそろえる */
  input[type=text], input[type=password], input[type=search], input[type=number], input[type=url],
  input[type=date], input[type=time], select, textarea {
    width: 100%; padding: 10px 12px; font-size: 16px; background: var(--card);
    border: 1px solid var(--line); border-radius: 10px; outline: none; min-height: 44px;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  textarea { resize: none; line-height: 1.6; }
  button { cursor: pointer; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 8px 14px; min-height: 36px; }
  button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  a { color: var(--accent); }
  [hidden] { display: none !important; }
  .ic { display: inline-flex; width: 20px; height: 20px; flex: none; }
  .ic svg { width: 100%; height: 100%; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .btn-danger { color: var(--danger); }
  .icon-btn {
    border: 0; background: transparent; padding: 8px; border-radius: 10px; min-height: 40px; min-width: 40px;
    color: var(--muted); display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .icon-btn:hover { background: var(--accent-soft); color: var(--text); }
  .link-btn { border: 0; background: none; padding: 0; min-height: 0; color: var(--accent); font-size: 14px; font-weight: 600; }
  .sp { flex: 1; }
  .muted { color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  /* ======================= 初回設定（文字なし） ======================= */
  #setup { display: flex; flex-direction: column; gap: 12px; max-width: 360px; margin: 18vh auto 0; padding: 0 16px; }
  #setup input { background: var(--card); }
  #setup input.bad { border-color: var(--danger); outline: 2px solid var(--danger); outline-offset: -1px; }
  #setup.busy { opacity: .5; pointer-events: none; }

  /* ======================= 骨組み ======================= */
  #app { min-height: 100vh; min-height: 100dvh; }
  #main { min-width: 0; padding: calc(env(safe-area-inset-top) + 8px) 16px calc(150px + env(safe-area-inset-bottom)); }
  .inner { max-width: 720px; margin: 0 auto; }
  @media (min-width: 900px) {
    #app { display: grid; grid-template-columns: 264px minmax(0, 1fr); }
    #tabbar { display: none !important; }
    #main { padding: 28px 32px 120px; }
  }
  @media (max-width: 899px) { #side { display: none !important; } }

  /* サイドバー（広い画面） */
  #side {
    position: sticky; top: 0; height: 100vh; height: 100dvh; overflow-y: auto;
    background: var(--sunk); border-right: 1px solid var(--line);
    padding: 16px 10px; display: flex; flex-direction: column; gap: 2px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: transparent;
    padding: 7px 10px; min-height: 38px; border-radius: 10px; text-align: left; color: var(--text);
  }
  .nav-item:hover { background: color-mix(in srgb, var(--text) 6%, transparent); }
  .nav-item.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .nav-item .ic { color: var(--accent); }
  .nav-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 400; }
  .count.alert { color: var(--danger); font-weight: 700; }
  .nav-sec { font-size: 12px; color: var(--muted); font-weight: 700; margin: 16px 10px 4px; }
  .pdot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
  .nav-item .pdot { margin: 0 5px; }
  .side-foot { margin-top: auto; padding-top: 12px; display: flex; align-items: center; gap: 2px; }
  .sync { font-size: 12px; color: var(--muted); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-left: 8px; }
  .sync.error { color: var(--danger); }
  .sync.offline, .sync.dirty { color: var(--warn); }

  /* 下のタブ（スマホ） */
  #tabbar {
    position: fixed; z-index: 30; left: 0; right: 0; bottom: 0;
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
    padding: 4px 8px env(safe-area-inset-bottom);
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    -webkit-backdrop-filter: saturate(1.6) blur(18px); backdrop-filter: saturate(1.6) blur(18px);
    border-top: 1px solid var(--line);
  }
  .tab {
    position: relative; border: 0; background: none; border-radius: 0; min-height: 52px; padding: 6px 0 4px;
    display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--muted);
  }
  .tab .ic { width: 25px; height: 25px; }
  .tab.on { color: var(--accent); font-weight: 600; }
  .tab .badge {
    position: absolute; top: 3px; left: calc(50% + 8px); min-width: 18px; height: 18px; padding: 0 5px;
    border-radius: 9px; background: var(--faint); color: #fff; font-size: 11px; line-height: 18px; font-weight: 700;
  }
  .tab .badge.alert { background: var(--danger); }

  /* 追加ボタン */
  #fab {
    position: fixed; z-index: 31; right: 18px; bottom: calc(74px + env(safe-area-inset-bottom));
    width: 58px; height: 58px; border-radius: 50%; padding: 0; border: 0;
    background: var(--accent); color: var(--accent-ink);
    box-shadow: 0 10px 26px color-mix(in srgb, var(--accent) 45%, transparent), 0 2px 6px rgba(0, 0, 0, .12);
    display: flex; align-items: center; justify-content: center; transition: transform .12s;
  }
  #fab .ic { width: 30px; height: 30px; }
  #fab:active { transform: scale(.92); }
  @media (min-width: 900px) { #fab { bottom: 30px; right: 30px; } }

  /* ======================= 見出し ======================= */
  .top { display: flex; align-items: flex-end; gap: 12px; margin: 6px 0 14px; min-height: 52px; }
  .top .grow { flex: 1; min-width: 0; }
  .top h1 { font-size: 32px; font-weight: 800; letter-spacing: -.01em; margin: 0; line-height: 1.15; overflow-wrap: anywhere; }
  .top .sub { font-size: 14px; color: var(--muted); margin-top: 2px; }
  .ring-sm { flex: none; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .ring-sm svg { width: 44px; height: 44px; transform: rotate(-90deg); }
  .ring-sm .trk { stroke: var(--line); }
  .ring-sm .val { stroke: var(--accent); transition: stroke-dashoffset .5s ease; }
  #syncPill {
    border: 0; border-radius: 999px; padding: 4px 10px; min-height: 28px; font-size: 12px; font-weight: 600;
    background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); align-self: center;
  }
  #syncPill.error { background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); }

  /* ======================= タスクの行 ======================= */
  .group { margin-top: 22px; scroll-margin-top: 16px; }
  .group-h { display: flex; align-items: baseline; gap: 8px; margin: 0 0 2px; padding: 0 2px; }
  .group-h h3 { font-size: 15px; margin: 0; font-weight: 700; }
  .group-h.late h3 { color: var(--danger); }
  .group-h.faint h3 { color: var(--faint); font-weight: 600; }
  .tasks { list-style: none; margin: 0; padding: 0; }
  .task { position: relative; touch-action: pan-y; overflow: hidden; }
  .task-inner {
    position: relative; z-index: 1; display: flex; align-items: flex-start; gap: 10px;
    padding: 10px 2px 10px 0; background: var(--bg); min-height: 52px;
  }
  .task + .task .task-inner::before { content: ""; position: absolute; top: 0; left: 40px; right: 0; border-top: 1px solid var(--line); }
  .task.sel .task-inner { background: color-mix(in srgb, var(--accent) 9%, var(--bg)); border-radius: 10px; }
  @media (hover: hover) { .task:hover .task-inner { background: color-mix(in srgb, var(--text) 3%, var(--bg)); } }
  .swipe-bg {
    position: absolute; inset: 0; display: flex; align-items: center; gap: 8px; padding: 0 22px;
    font-weight: 700; font-size: 15px; color: #fff; opacity: 0;
  }
  .swipe-bg .ic { width: 22px; height: 22px; }
  .done-bg { background: var(--ok); justify-content: flex-start; }
  .sched-bg { background: var(--accent); color: var(--accent-ink); justify-content: flex-end; }
  .task.swiping[data-dir=right] .done-bg, .task.swiping[data-dir=left] .sched-bg { opacity: .55; }
  .task.arm-done .done-bg, .task.arm-sched .sched-bg { opacity: 1; }
  .task.swiping { user-select: none; -webkit-user-select: none; }
  .check {
    flex: none; width: 40px; height: 40px; margin: -8px -4px -8px -6px; padding: 0; border: 0; background: none;
    display: grid; place-items: center; min-height: 0;
  }
  .ring {
    width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--faint); position: relative;
    transition: background .15s, border-color .15s, transform .15s;
  }
  .check.p1 .ring { border-color: var(--p1); background: color-mix(in srgb, var(--p1) 12%, transparent); }
  .check.p2 .ring { border-color: var(--p2); background: color-mix(in srgb, var(--p2) 12%, transparent); }
  .check.p3 .ring { border-color: var(--p3); background: color-mix(in srgb, var(--p3) 12%, transparent); }
  .ring::after {
    content: ""; position: absolute; left: 6px; top: 2px; width: 5px; height: 10px; opacity: 0;
    border: solid #fff; border-width: 0 2.4px 2.4px 0; transform: rotate(45deg);
  }
  @media (hover: hover) { .check:hover .ring::after { opacity: .5; border-color: var(--muted); } }
  .task.done .ring, .task.completing .ring { background: var(--ok); border-color: var(--ok); }
  .task.done .ring { background: var(--faint); border-color: var(--faint); }
  .task.done .ring::after, .task.completing .ring::after { opacity: 1; border-color: #fff; }
  .task.completing .ring { animation: pop .35s ease; }
  .task.completing .title { text-decoration: line-through; color: var(--muted); transition: color .2s; }
  .task.leaving { transition: height .26s ease, opacity .26s ease; opacity: 0; height: 0 !important; }
  @keyframes pop { 0% { transform: scale(1); } 45% { transform: scale(1.3); } 100% { transform: scale(1); } }
  .emo { flex: none; font-size: 20px; line-height: 26px; width: 26px; text-align: center; margin-left: -2px; }
  .body { flex: 1; min-width: 0; cursor: pointer; outline: none; padding-top: 1px; }
  .title { overflow-wrap: anywhere; line-height: 1.45; }
  .task.done .title { color: var(--muted); text-decoration: line-through; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; font-size: 13px; color: var(--muted); margin-top: 2px; }
  .mchip { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; padding: 0; min-height: 0; color: inherit; font-size: inherit; border-radius: 0; }
  .mchip .ic { width: 14px; height: 14px; }
  button.mchip:hover { color: var(--text); }
  .mchip.late { color: var(--danger); font-weight: 600; }
  .mchip.today { color: var(--ok); font-weight: 600; }
  .mchip.sun { color: var(--warn); }
  .acts { display: flex; opacity: 0; margin: -6px 0; }
  .task:hover .acts, .task.sel .acts, .task:focus-within .acts { opacity: 1; }
  .acts .icon-btn.on { color: var(--warn); }
  @media (hover: none) { .acts { display: none; } }

  /* ======================= 今日 ======================= */
  .plan { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
  .plan .meter { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .plan .fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width .4s ease; }
  .plan.over .fill { background: var(--danger); }
  .plan-text { font-size: 13px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .plan.over .plan-text { color: var(--danger); font-weight: 600; }
  .pill-btn {
    display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 6px 14px; min-height: 36px;
    background: var(--accent-soft); border: 0; color: var(--accent); font-weight: 700; font-size: 14px;
  }
  .pill-btn .ic { width: 18px; height: 18px; }
  .nudge { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 14px; color: var(--muted); }
  .nudge .ic { width: 18px; height: 18px; }
  /* タイムライン（Structured / Tiimo 風） */
  .timeline { margin-top: 6px; }
  .tl-item { display: grid; grid-template-columns: 46px 34px minmax(0, 1fr); min-height: var(--h); }
  .tl-time { text-align: right; font-size: 13px; font-weight: 600; padding-top: 12px; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .tl-time small { display: block; font-weight: 400; color: var(--faint); font-size: 11px; margin-top: 2px; }
  .tl-rail { position: relative; display: flex; justify-content: center; }
  .tl-rail::before { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; border-left: 2px dotted var(--line); transform: translateX(-1px); }
  .tl-pill {
    position: relative; z-index: 1; width: 26px; margin: 8px 0; border-radius: 13px; height: calc(var(--h) - 16px);
    background: var(--col); display: flex; justify-content: center; padding-top: 3px; font-size: 14px; line-height: 20px;
  }
  .tl-item.done .tl-pill { opacity: .35; }
  .tl-item .task-inner::before { display: none; }
  .tl-gap, .tl-now { display: grid; grid-template-columns: 46px 34px minmax(0, 1fr); align-items: center; min-height: 30px; font-size: 12px; color: var(--faint); }
  .tl-gap .tl-rail, .tl-now .tl-rail { align-self: stretch; }
  .tl-now { color: var(--danger); font-weight: 700; min-height: 18px; }
  .tl-now .bar { height: 2px; background: var(--danger); border-radius: 1px; position: relative; }
  .tl-now .bar::before { content: ""; position: absolute; left: -5px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--danger); }
  .tl-now span:first-child { text-align: right; }
  /* 空のとき */
  .empty { color: var(--muted); text-align: center; padding: 40px 16px 24px; font-size: 15px; }
  .empty svg { width: 120px; height: 120px; display: block; margin: 0 auto 14px; }
  .empty b { display: block; color: var(--text); font-size: 18px; margin-bottom: 4px; }
  .empty .pill-btn { margin-top: 16px; }

  /* ======================= 予定（週の帯） ======================= */
  .week { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 4px -16px 0; padding: 4px 16px 8px; scroll-snap-type: x proximity; }
  .week::-webkit-scrollbar { display: none; }
  .day-chip {
    flex: none; width: 48px; min-height: 0; border-radius: 14px; border: 1px solid var(--line); background: var(--card);
    display: flex; flex-direction: column; align-items: center; padding: 6px 0 5px; gap: 1px; font-size: 11px; color: var(--muted);
    scroll-snap-align: start;
  }
  .day-chip b { font-size: 18px; color: var(--text); font-variant-numeric: tabular-nums; }
  .day-chip.sat b { color: var(--c1); }
  .day-chip.sun b { color: var(--danger); }
  .day-chip .dot { width: 5px; height: 5px; border-radius: 50%; background: transparent; }
  .day-chip.has .dot { background: var(--accent); }

  /* ======================= カード・統計 ======================= */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-top: 14px; }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .stat b { display: block; font-size: 22px; line-height: 1.25; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12px; color: var(--muted); }
  @media (max-width: 480px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 12px; } }
  .meter { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .meter .fill { height: 100%; background: var(--accent); border-radius: 3px; }
  .hint { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
  .chart { margin-top: 16px; }
  .chart-h { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .bars { height: 88px; display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 2px; border-bottom: 1px solid var(--line); }
  .bar-col { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; border-radius: 4px; }
  .bar-col:hover { background: color-mix(in srgb, var(--text) 5%, transparent); }
  .bar { width: min(16px, 70%); background: var(--accent); border-radius: 4px 4px 0 0; }
  .bar-val { font-size: 11px; font-variant-numeric: tabular-nums; }
  .bar-labels { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 2px; font-size: 11px; color: var(--muted); text-align: center; margin-top: 3px; }
  #tip { position: fixed; z-index: 90; pointer-events: none; background: var(--text); color: var(--bg); font-size: 12px; padding: 4px 8px; border-radius: 6px; white-space: nowrap; }

  /* マトリクス */
  .matrix { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; margin-top: 14px; }
  @media (max-width: 700px) { .matrix { grid-template-columns: minmax(0, 1fr); } }
  .quad { margin-top: 0; padding: 12px 12px 4px; border-top-width: 4px; }
  .quad .task-inner { background: var(--card); }
  .quad.q1 { border-top-color: var(--p1); } .quad.q2 { border-top-color: var(--p3); }
  .quad.q3 { border-top-color: var(--p2); } .quad.q4 { border-top-color: var(--faint); }
  .quad-h { display: flex; align-items: baseline; gap: 8px; padding-bottom: 4px; }
  .quad-h h3 { margin: 0; font-size: 16px; }

  /* ブラウズ（スマホのメニュー） */
  .glist { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; margin-top: 8px; }

  .search-big input { padding-left: 40px; border-radius: 12px; background: var(--card); }

  /* ======================= シート（下から出る画面） ======================= */
  #backdrop { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .32); animation: fade .2s ease; }
  #sheet {
    position: fixed; z-index: 51; left: 0; right: 0; bottom: var(--kb, 0px);
    max-height: calc(92dvh - var(--kb, 0px)); overflow-y: auto; overscroll-behavior: contain;
    background: var(--card); border-radius: 20px 20px 0 0; box-shadow: var(--shadow);
    padding: 8px 16px calc(16px + env(safe-area-inset-bottom)); animation: up .26s cubic-bezier(.2, .8, .2, 1);
  }

      left: 50%; right: auto; bottom: auto; top: 10vh; width: 560px; max-height: 80vh; border-radius: 18px;
      transform: translateX(-50%); padding: 18px 20px 20px; animation: pop-in .18s ease;
    }

  }
  @keyframes fade { from { opacity: 0; } }

  .sheet-title { font-size: 17px; font-weight: 700; margin: 2px 0 10px; display: flex; align-items: center; gap: 8px; }
  .sheet-title .sp { flex: 1; }
  .sheet-item {
    display: flex; align-items: center; gap: 14px; width: 100%; min-height: 52px; padding: 0 6px;
    border: 0; border-radius: 0; background: none; text-align: left; font-size: 16px;
  }

  .sheet-item .ic { color: var(--accent); }
  .sheet-item .lbl { flex: 1; }
  .sheet-item .val { color: var(--muted); font-size: 14px; }
  .sheet-item input[type=date] { width: auto; min-height: 36px; padding: 4px 8px; }
  /* クイック追加 */
  /* ルーティン（タップで埋めていく） */
  /* マスはすべて同じ大きさ（行の高さを固定し、名前は 2 行まで） */
  .rt-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: 104px; gap: 8px; margin-top: 8px; }
  @media (min-width: 600px) { .rt-grid { grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); } }
  .rt-wrap { position: relative; min-width: 0; height: 100%; }
  .rt {
    position: relative; width: 100%; height: 100%; min-height: 0; padding: 8px 4px; border-radius: 16px;
    border: 1.5px solid var(--line); background: var(--card); overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-align: center;
    transition: background .18s, border-color .18s, transform .1s;
  }
  .rt:active { transform: scale(.94); }
  .rt-emo { font-size: 26px; line-height: 30px; }
  .rt-t {
    font-size: 12px; line-height: 1.3; font-weight: 700; overflow-wrap: anywhere; text-wrap: balance; word-break: auto-phrase;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; max-width: 100%;
  }
  .rt-s { font-size: 11px; line-height: 14px; min-height: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .rt.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .rt.on .rt-s { color: inherit; opacity: .85; }
  .rt.on::after { content: "✓"; position: absolute; top: 5px; right: 9px; font-size: 13px; font-weight: 800; }
  .rt.pop { animation: pop .35s ease; }
  .rt-link { position: absolute; top: 2px; left: 2px; width: 30px; height: 30px; display: grid; place-items: center; color: var(--muted); border-radius: 10px; }
  .rt-link .ic { width: 14px; height: 14px; }
  .rt-done { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; background: var(--accent-soft); color: var(--accent); font-weight: 700; margin-top: 8px; }

  .rt-ed .row2 { margin-top: 8px; }
  @media (max-width: 480px) {
    .hg { grid-template-columns: minmax(0, 1fr) repeat(14, 10px) 34px; gap: 5px 2px; }
    .hg .c { width: 10px; height: 10px; }
  }
  .tip ul { margin: 6px 0 0; padding-left: 18px; font-size: 14px; color: var(--muted); line-height: 1.7; }
  .plan-top { display: flex; align-items: center; gap: 10px; margin-top: 2px; }
  .plan-text.over { color: var(--danger); font-weight: 600; }

  /* Google カレンダーの予定 */

    display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 600;
    text-decoration: none; color: var(--text); background: color-mix(in srgb, var(--col) 16%, transparent);
  }
  .ad-chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--col); }
  .tl-item.ev .tl-pill { background: color-mix(in srgb, var(--col) 22%, var(--bg)); border: 2px solid var(--col); }
  .ev-card { display: flex; gap: 10px; padding: 10px 0; color: inherit; text-decoration: none; min-width: 0; }

  .ev-list { margin: 2px 0 2px; }
  .ev-row { display: flex; align-items: baseline; gap: 10px; padding: 6px 2px; font-size: 14px; color: inherit; text-decoration: none; }

  .ev-row .d { width: 8px; height: 8px; border-radius: 50%; background: var(--col); flex: none; align-self: center; }
  .ev-row .n { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .ev-row .l { color: var(--muted); font-size: 12px; }
  .qa-ctx { font-size: 12px; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
  .qa input#qaInput { font-size: 18px; border: 0; box-shadow: none; padding: 6px 2px; background: transparent; min-height: 40px; }
  .qa textarea { border: 0; box-shadow: none; padding: 2px 2px; background: transparent; min-height: 0; font-size: 15px; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 2px; min-height: 0; }
  .qchip { font-size: 13px; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); display: inline-flex; gap: 4px; align-items: center; font-weight: 600; }
  .qchip .ic { width: 14px; height: 14px; }
  .qa-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
  .qa-bar .icon-btn { flex: none; font-size: 14px; padding: 6px 9px; }
  .qa-bar .btn-primary { flex: none; border-radius: 999px; padding: 8px 18px; }
  @media (max-width: 520px) { .qa-bar .t { display: none; } .qa-bar .icon-btn { min-width: 36px; padding: 6px; } }
  .qa-proj { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .qa-proj button { border-radius: 999px; padding: 4px 12px; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
  /* 計画（提案） */
  .sug { display: flex; align-items: center; gap: 10px; min-height: 52px; border-top: 1px solid var(--line); }
  .sug .body { cursor: default; }
  .sug .add {
    flex: none; width: 34px; height: 34px; min-height: 0; padding: 0; border-radius: 50%; border: 0;
    background: var(--accent-soft); color: var(--accent); display: grid; place-items: center;
  }
  .sug .add.on { background: var(--ok); color: #fff; }
  .sug .add .ic { width: 18px; height: 18px; }
  /* 空き時間への提案（点線の枠。✓ で入れる、× で見送る） */
  .tl-item.pp .tl-pill { background: transparent; border: 2px dashed var(--col); }
  .pp-card { display: flex; align-items: center; gap: 6px; min-width: 0; margin: 6px 0; padding: 8px 8px 8px 12px; border: 1.5px dashed var(--line); border-radius: 14px; }
  .pp-body { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 0; color: inherit; font: inherit; cursor: pointer; min-height: 0; }
  .pp-body .title { font-weight: 600; overflow-wrap: anywhere; }
  .pp-tag { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 700; color: var(--accent); margin-right: 6px; vertical-align: 1px; }
  .pp-tag .ic { width: 13px; height: 13px; }
  .pp-when { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 6px; font-weight: 600; }
  .pp-why { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .pp-btn { flex: none; width: 36px; height: 36px; min-height: 0; padding: 0; border-radius: 50%; border: 0; display: grid; place-items: center; background: var(--chip); color: var(--muted); }

  .pp-btn .ic { width: 18px; height: 18px; }
  .pp-card.pp-row { display: block; padding: 0 8px 8px 0; }
  .pp-row .tasks { margin: 0; }
  .pp-row .acts { display: none; } /* 今日やる・集中は詳細から。下の ✓ × と並べない */
  .pp-foot { display: flex; align-items: center; gap: 6px; padding-left: 12px; }

  .pp-list .pp-card { margin: 4px 0; }
  .pp-un { font-size: 13px; color: var(--muted); padding: 6px 2px; border-top: 1px solid var(--line); }

  /* ======================= 詳細 ======================= */
  #detail {
    position: fixed; z-index: 40; inset: 0; background: var(--bg); overflow-y: auto; overscroll-behavior: contain;
    padding: calc(env(safe-area-inset-top) + 6px) 16px calc(40px + env(safe-area-inset-bottom));

  }

  }
  @keyframes slide { from { transform: translateX(100%); } }
  @media (min-width: 1320px) { body.detail-open #main { padding-right: 470px; } #detail { box-shadow: none; } }
  .d-head { display: flex; align-items: center; gap: 2px; margin: 0 -8px 6px; }

  .d-notes { border: 0 !important; box-shadow: none !important; background: transparent !important; padding: 2px 0 !important; color: var(--text); min-height: 28px !important; }
  .links a { display: block; font-size: 14px; overflow-wrap: anywhere; margin-top: 2px; }
  .props { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); margin-top: 14px; overflow: hidden; }
  .prop {
    display: flex; align-items: center; gap: 12px; width: 100%; min-height: 50px; padding: 0 14px;
    border: 0; border-radius: 0; background: none; text-align: left; font-size: 16px;
  }
  .props > * + * { border-top: 1px solid var(--line); }
  .prop .ic { color: var(--accent); }
  .prop .lbl { flex: 1; }

  .prop .val.set { color: var(--text); }
  .prop .chev { width: 16px; height: 16px; color: var(--faint); transition: transform .15s; }
  .prop[aria-expanded=true] .chev { transform: rotate(90deg); }

  .switch { width: 51px; height: 31px; min-height: 0; border-radius: 16px; padding: 0; border: 0; background: var(--line); position: relative; flex: none; transition: background .2s; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0, 0, 0, .2); transition: transform .2s; }
  .switch[aria-checked=true] { background: var(--ok); }
  .switch[aria-checked=true]::after { transform: translateX(20px); }
  .row { display: flex; gap: 8px; align-items: center; }

  .dl-seg { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }

  .dl-list { list-style: none; margin: 6px 0 0; padding: 0; }

  /* ======================= 集中モード ======================= */
  #focus {

  }

    background: var(--text); color: var(--bg); border-radius: 16px; padding: 4px 6px 4px 14px; cursor: pointer;
    display: flex; align-items: center; gap: 10px; box-shadow: var(--shadow);
  }
  @media (min-width: 900px) { #focusBar { left: 50%; transform: translateX(-50%); bottom: 34px; max-width: 520px; } }
  .fb-kind { font-size: 12px; opacity: .75; white-space: nowrap; }

  /* ======================= 通知・紙吹雪 ======================= */
  #toast {
    position: fixed; z-index: 80; left: 50%; transform: translateX(-50%); bottom: calc(144px + env(safe-area-inset-bottom));
    background: var(--text); color: var(--bg); border-radius: 12px; box-shadow: var(--shadow);
    padding: 6px 6px 6px 16px; display: flex; gap: 10px; align-items: center; width: max-content; max-width: calc(100% - 32px); font-size: 14px;
    animation: toast-in .2s ease;
  }

  @keyframes toast-in { from { opacity: 0; transform: translate(-50%, 8px); } }
  #toastMsg { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #undoBtn { background: transparent; border: 0; color: var(--accent); font-weight: 700; min-height: 32px; filter: brightness(1.35); }
  #confetti { position: fixed; inset: 0; z-index: 85; pointer-events: none; overflow: hidden; }
  #confetti i { position: absolute; top: -12px; width: 8px; height: 12px; border-radius: 2px; animation: fall linear forwards; }

    { v: { type: 'upcoming' }, label: '予定', ic: 'calendar', count: act.filter((t) => isUpcoming(t, T)).length },
    { v: { type: 'inbox' }, label: '受信箱', ic: 'inbox', count: act.filter((t) => isInbox(t, T)).length },
    { v: { type: 'anytime' }, label: 'すべて', ic: 'list', count: act.filter(isAnytime).length },
    { v: { type: 'someday' }, label: 'いつか', ic: 'box', count: act.filter((t) => t.someday).length },
    { v: { type: 'portal' }, label: '研究・締切', ic: 'flag', count: portalDeadlines(T).filter((x) => x.daysLeft <= 7 && x.status !== '候補' && x.status !== '条件付き').length || null, alert: true },
    { sec: 'ふりかえり' },
    { v: { type: 'matrix' }, label: 'マトリクス', ic: 'grid' },
    { v: { type: 'review' }, label: '週次レビュー', ic: 'review', count: !last || daysBetween(last, T) >= 7 ? '●' : null, alert: true },
    { v: { type: 'logbook' }, label: '完了ログ', ic: 'checkCircle' },
    { action: () => openRoutines(), label: 'ルーティンを編集', ic: 'checklist' },
  ];
  const projects = new Map();
  for (const t of act) if (t.project) projects.set(t.project, (projects.get(t.project) || 0) + 1);
  if (view.type === 'project' && !projects.has(view.name)) projects.set(view.name, 0);
  if (projects.size) {
    items.push({ sec: 'プロジェクト' });
    for (const [name, n] of [...projects].sort((a, b) => a[0].localeCompare(b[0], 'ja'))) {

  if (view.type === 'tag' && !tags.has(view.name)) tags.set(view.name, 0);

    items.push({ sec: 'タグ' });

      items.push({ v: { type: 'tag', name }, label: name, ic: 'tag', count: n });

  } else if (t.time && !opts.hideDate) meta.push(h('span', { class: 'mchip' }, icon('clock'), t.time));
  if (t.repeat) meta.push(h('span', { class: 'mchip', title: describeRepeat(t.repeat), 'aria-label': describeRepeat(t.repeat) }, icon('repeat')));

      }, h('span', { class: 'ring' })),

      h('div', { class: 'body', 'data-act': 'open', tabindex: '0', role: 'button', 'aria-label': '詳細を開く: ' + t.title },
        h('div', { class: 'title' }, text || '（無題）'),

function renderMain(d, T, model) {
  const c = $('content');
  const act = d.todos.filter((t) => !t.done);
  const Td = parseYmd(T);
  const nodes = [];
  let title = '', sub = '', extra = null;

  switch (view.type) {
    case 'today': {
      title = '今日'; sub = fmtFull(T);
      const list = act.filter((t) => isToday(t, T));
      const doneToday = d.todos.filter((t) => t.done && t.doneAt && localYmd(t.doneAt) === T).sort((a, b) => cmp(b.doneAt, a.doneAt));
      // 進み具合はタスクとルーティンを合わせて数える
      const rDay = routineDay();
      const rList = routinesFor(d, rDay);
      const rDone = rList.filter((r) => routineDone(d, rDay).has(r.id)).length;
      const total = list.length + doneToday.length + rList.length;
      const doneN = doneToday.length + rDone;
      if (total) extra = h('div', { class: 'ring-sm', title: `今日 ${doneN}/${total} 完了（ルーティンを含む）` }, `${doneN}/${total}`, ringSvg(doneN / total, 44, 5));
      const evs = eventsOn(T);
      nodes.push(tipCard(), deadlineCard(T), routineSection(d, T), planBar(list, d, T, evs));
      if (evs.allDay.length) {
        nodes.push(h('div', { class: 'allday', 'aria-label': '終日の予定' }, evs.allDay.map((ev) =>
          h('a', { class: 'ad-chip', href: gcalDayUrl(T), target: '_blank', rel: 'noopener noreferrer', style: `--col:${calColor(ev.cal)}`, title: 'Google カレンダーで開く' }, ev.title))));
      }
      const inboxN = act.filter((t) => isInbox(t, T)).length;
      if (inboxN) {
        nodes.push(h('div', { class: 'nudge' }, icon('inbox'), `受信箱に未整理が ${inboxN} 件`,
          h('button', { class: 'link-btn', type: 'button', onclick: () => setView({ type: 'inbox' }) }, '整理する')));
      }
      // 今日の提案があるタスクはタイムラインに出す（下の一覧とは重ねない）
      const props = liveProposals(d, T).filter((p) => p.date === T);
      const proposed = new Set(props.map((p) => p.t.id));
      const late = list.filter((t) => isLate(t, T) && !proposed.has(t.id)).sort(byDefault);
      const rest = list.filter((t) => !isLate(t, T) && !proposed.has(t.id));
      const timed = rest.filter((t) => t.time).sort(byDay);
      const untimed = rest.filter((t) => !t.time).sort(byDay);
      if (late.length) {
        nodes.push(group('期限切れ', late, T, {
          cls: 'late', plan: true,
          action: h('button', { class: 'link-btn', type: 'button', onclick: () => moveToToday(late) }, 'すべて今日に'),
        }));
      }
      const hasTl = timed.length || evs.timed.length || props.length;
      if (hasTl) {
        nodes.push(h('section', { class: 'group' },
          h('div', { class: 'group-h' }, h('h3', null, 'タイムライン'), h('span', { class: 'sp' }),
            props.length > 1 ? h('button', { class: 'link-btn', type: 'button', onclick: () => acceptProposals(props) }, `提案 ${props.length} 件を承認`) : null),
          timeline(timed, evs.timed, T, props)));
      }
      if (untimed.length) nodes.push(group(hasTl ? '時間未定' : late.length ? '今日' : 'タスク', untimed, T, { plan: true }));
      if (!list.length && !props.length) {
        nodes.push(doneToday.length
          ? emptyState('done', '今日のタスクはすべて完了', 'おつかれさまでした。')
          : emptyState('today', '今日のタスクはまだありません', '「計画」から今日やることを選ぶか、＋ で追加しましょう。'));
      }
      if (doneToday.length) {
        nodes.push(h('section', { class: 'group' },
          h('button', { class: 'link-btn', type: 'button', 'aria-expanded': String(showTodayDone), onclick: () => { showTodayDone = !showTodayDone; render(); } },
            `${showTodayDone ? '▾' : '▸'} 今日の完了 ${doneToday.length} 件`),
          showTodayDone ? taskList(doneToday, T) : null));
      }
      break;
    }
    case 'upcoming': {
      title = '予定'; sub = '日付の決まっているこれからのタスク';
      const list = act.filter((t) => isUpcoming(t, T));
      const live = liveProposals(d, T);
      const propsOn = (k) => live.filter((p) => p.date === k);
      const strip = h('div', { class: 'week', role: 'list', 'aria-label': '日付へ移動' });
      for (let i = 1; i <= 14; i++) {
        const dd = addDays(Td, i);
        const k = ymd(dd);
        const n = list.filter((t) => t.due === k).length + propsOn(k).length + (() => { const e = eventsOn(k); return e.allDay.length + e.timed.length; })();
        strip.append(h('button', {
          class: 'day-chip' + (dd.getDay() === 6 ? ' sat' : dd.getDay() === 0 ? ' sun' : '') + (n ? ' has' : ''), type: 'button', role: 'listitem',
          'aria-label': `${fmtShort(k)} ${n}件`,
          onclick: () => document.getElementById('day-' + k)?.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'start' }),
        }, WD[dd.getDay()], h('b', null, String(dd.getDate())), h('span', { class: 'dot' })));
      }
      nodes.push(strip);
      for (let i = 1; i <= 14; i++) {
        const k = ymd(addDays(Td, i));
        const items = list.filter((t) => t.due === k).sort(byDay);
        const evList = evRows(eventsOn(k), k);
        const pp = propsOn(k);
        const ppList = pp.length ? h('div', { class: 'pp-list' }, pp.map((p) => proposalCard(p, `${p.start}–${p.end}`))) : null;
        nodes.push(group(`${fmtShort(k)}  ${relWord(k, T)}`, items, T, {
          id: 'day-' + k, cls: items.length || evList || ppList ? '' : 'faint', pre: evList || ppList ? h('div', null, evList, ppList) : null,
        }));
      }
      const end = ymd(addDays(Td, 14));
      const months = new Map();
      for (const t of list.filter((x) => x.due > end).sort((a, b) => cmp(a.due, b.due) || byDay(a, b))) {
        const k = t.due.slice(0, 7);
        if (!months.has(k)) months.set(k, []);
        months.get(k).push(t);
      }
      for (const [k, items] of months) {
        const [y, m] = k.split('-').map(Number);
        nodes.push(group(y === Td.getFullYear() ? `${m}月` : `${y}年${m}月`, items, T));
      }
      break;
    }
    case 'inbox': {
      title = '受信箱'; sub = '日付・プロジェクト・「いつか」のどれかを決めると、ここから消えます';
      const list = act.filter((t) => isInbox(t, T)).sort((a, b) => cmp(b.createdAt, a.createdAt));
      nodes.push(list.length ? group('', list, T)
        : emptyState('inbox', '受信箱は空です', '思いついたことは ＋ からすぐ書き出しましょう。'));
      break;
    }
    case 'browse': {
      title = 'メニュー';
      if (!wide()) nodes.push(searchBox());
      const items = model.filter((it) => !it.v || !MAIN_TABS.includes(it.v.type));
      let cur = h('div', { class: 'glist' });
      nodes.push(cur);
      for (const it of items) {
        if (it.sec) { nodes.push(h('div', { class: 'gsec' }, it.sec)); cur = h('div', { class: 'glist' }); nodes.push(cur); continue; }
        cur.append(navButton(it, true));
      }
      nodes.push(h('div', { class: 'gsec' }, 'その他'), h('div', { class: 'glist' },
        h('button', { class: 'nav-item', type: 'button', onclick: openSettings }, icon('gear'), h('span', { class: 'nav-label' }, '設定'), icon('chevron')),
        h('button', { class: 'nav-item', type: 'button', onclick: openHelp }, icon('help'), h('span', { class: 'nav-label' }, '使い方'), icon('chevron'))));
      nodes.push(h('p', { class: 'hint', style: 'text-align:center;margin-top:16px' }, syncText));
      break;
    }
    case 'anytime': {
      title = 'すべて'; sub = '「いつか」以外の未完了タスク';
      const list = act.filter(isAnytime);
      const none = list.filter((t) => !t.project).sort(byDefault);
      if (none.length) nodes.push(group('プロジェクトなし', none, T));
      const names = [...new Set(list.map((t) => t.project).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'ja'));
      for (const n of names) nodes.push(group(n, list.filter((t) => t.project === n).sort(byDefault), T));
      if (!list.length) nodes.push(emptyState('done', 'タスクはありません', ''));
      break;
    }
    case 'someday': {
      title = 'いつか'; sub = '今は手を付けないけれど、忘れたくないこと';
      const list = act.filter((t) => t.someday).sort((a, b) => cmp(a.createdAt, b.createdAt));
      nodes.push(list.length ? group('', list, T) : emptyState('', '「いつか」リストは空です', ''));
      break;
    }
    case 'matrix': {
      title = 'マトリクス'; sub = '重要 = 優先度が高・中 ／ 緊急 = 期限が明日まで、または「今日やる」';
      const list = act.filter(isAnytime);
      const tom = ymd(addDays(Td, 1));
      const imp = (t) => t.priority === 1 || t.priority === 2;
      const urg = (t) => (!!t.due && t.due <= tom) || t.myDay === T;
      const quads = [
        ['q1', '今すぐやる', '重要 × 緊急', (t) => imp(t) && urg(t)],
        ['q2', '計画してやる', '重要 × 緊急でない', (t) => imp(t) && !urg(t)],
        ['q3', '手短に済ませる', '重要でない × 緊急', (t) => !imp(t) && urg(t)],
        ['q4', 'やらない・後回し', '重要でない × 緊急でない', (t) => !imp(t) && !urg(t)],
      ];
      nodes.push(h('div', { class: 'matrix' }, quads.map(([cls, name, desc, f]) => {
        const items = list.filter(f).sort(byDefault);
        return h('section', { class: 'card quad ' + cls, 'data-quad': cls },
          h('div', { class: 'quad-h' }, h('h3', null, name), h('span', null, desc), h('span', { class: 'sp' }), h('span', { class: 'count' }, String(items.length))),
          items.length ? taskList(items, T) : h('div', { class: 'hint', style: 'padding:6px 0 12px' }, 'なし'));
      })));
      break;
    }
    case 'review': {
      title = '週次レビュー'; sub = '週に一度、全体を見直して頭を空にする';
      const last = d.meta.lastReview;
      nodes.push(h('div', { class: 'card' }, last ? `前回のレビュー: ${fmtShort(last)}（${relWord(last, T)}）` : 'まだ一度もレビューしていません。'));
      const old = ymd(addDays(Td, -14));
      const mon = ymd(mondayOf(Td));
      const doneWeek = d.todos.filter((t) => t.done && t.doneAt && localYmd(t.doneAt) >= mon).length;
      const steps = [
        ['受信箱を空にする', '日付・プロジェクト・「いつか」を決めるか、不要なら削除', act.filter((t) => isInbox(t, T)).sort(byDefault)],
        ['期限切れを片付ける', '今日やるか、日付を付け直すか、手放す', act.filter((t) => isLate(t, T)).sort(byDefault)],

          h('div', null, h('h3', null, '今週を振り返る'),

      }

      break;

    case 'project': {

      const all = d.todos.filter((t) => t.project === view.name);
      const a = all.filter((t) => !t.done && !t.someday).sort(byDefault);
      const sd = all.filter((t) => !t.done && t.someday).sort(byDefault);

      if (a.length) nodes.push(group('', a, T));

      if (showProjectDone && dn.length) nodes.push(group('完了済み', dn, T));
      if (!a.length && !sd.length) nodes.push(emptyState('done', '未完了のタスクはありません', ''));
      break;

    case 'tag': {
      title = '@' + view.name;
      const list = act.filter((t) => t.tags.includes(view.name)).sort(byDefault);
      nodes.push(list.length ? group('', list, T) : emptyState('', 'このタグの未完了タスクはありません', ''));
      break;

      if (!wide()) nodes.push(searchBox());
      const words = view.q.toLowerCase().split(/[\s\u3000]+/).filter(Boolean);
      const match = (t) => {
        const hay = [t.title, t.notes, t.project || '', ...t.tags, ...t.checklist.map((x) => x.text)].join(' ').toLowerCase();
        return words.every((w) => (w[0] === '@' && w.length > 1 ? t.tags.some((g) => g.toLowerCase().includes(w.slice(1)))
          : w[0] === '#' && w.length > 1 ? (t.project || '').toLowerCase().includes(w.slice(1)) : hay.includes(w)));
      };
      const hits = d.todos.filter(match);
      const a = hits.filter((t) => !t.done).sort(byDefault);
      const dn = hits.filter((t) => t.done).sort((x, y) => cmp(y.doneAt || '', x.doneAt || '')).slice(0, 50);
      if (a.length) nodes.push(group('未完了', a, T));
      if (dn.length) nodes.push(group('完了済み', dn, T));
      if (!hits.length) nodes.push(emptyState('search', '見つかりませんでした', ''));
      break;
    }
  }
  $('viewTitle').textContent = title;
  $('viewSub').textContent = sub;
  $('headExtra').replaceChildren(...(extra ? [extra] : []));
  const shown = nodes.filter(Boolean); // 出すものが無い部分（null）は飛ばす
  // 検索欄を入力中なら、その欄だけは作り直さない
  if (mSearch && shown[0] === mSearch && c.firstChild === mSearch) {
    while (c.childNodes.length > 1) c.lastChild.remove();
    c.append(...shown.slice(1));
  } else c.replaceChildren(...shown);
}

function statsCard(d, T) {

/* ---------- 今日の計画（Microsoft To Do の「提案」風） ---------- */
function planSuggestions(d, T) {

  const soonL = cand.filter((t) => t.due && t.due <= soon).sort((a, b) => cmp(a.due, b.due) || byDefault(a, b));
  const imp = cand.filter((t) => !t.due && (t.priority === 1 || t.priority === 2)).sort(byDefault);
  const inbox = cand.filter((t) => isInbox(t, T) && !imp.includes(t)).sort((a, b) => cmp(b.createdAt, a.createdAt)).slice(0, 10);

}

const findTask = (id) => DATA.todos.find((x) => x.id === id);

    mutate({ t: 'patch', id, set: { done: false, doneAt: null } });
    toast('未完了に戻しました', { t: 'restore', tasks: [snap] });

  }
  if (t.repeat && t.due) {
    const next = nextDue(t.due, t.repeat, T);
    const logId = uid();
    mutate({ t: 'complete', id, from: t.due, next, logId });

  } else {

function completeTask(id, el) {

  el = el || document.querySelector(`#content .task[data-id="${CSS.escape(id)}"]`);
  playDone();

  el.classList.add('completing');
  setTimeout(() => {
    el.style.height = el.offsetHeight + 'px';

    el.classList.add('leaving');

  }, 360);
}

}

  const o = audio.createOscillator();

  o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(audio.destination);
  o.start(t0);
  o.stop(t0 + dur + 0.02);
}

 * 集中タイマー（ポモドーロ）。開始すると全画面の集中モードになる
 * ========================================================================= */
let timer = loadJSON(KEY.timer, null); // { taskId, title, kind: 'work'|'break', dur(秒), startedAt, endsAt, left }
let barKey = '';

}
function askNotify() {
  try { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission()?.catch?.(() => {}); } catch {}
}
function startFocus(id) {
  const t = findTask(id);
  if (!t) return;
  if (timer && timer.kind === 'work') stopFocus();
  const min = DATA.meta.pomo || 25;
  timer = { taskId: id, title: t.title, kind: 'work', dur: min * 60, startedAt: Date.now(), endsAt: Date.now() + min * 60000, left: null };
  saveTimer();
  unlockAudio();
  askNotify();
  openFocusMode();
}

  mutate({ t: 'focus', id: tm.taskId, session: { id: uid(), at: new Date(tm.startedAt).toISOString(), min } });
}

function stopFocus() {
  if (!timer) return;
  if (timer.kind === 'work') {
    const min = Math.floor((timer.dur * 1000 - Math.max(0, timeLeft())) / 60000);
    if (min >= 1) logFocus(timer, min);
  }
  timer = null;
  saveTimer();
  closeFocusMode();
  tick();
}
function finishPhase() {
  const lateBy = -timeLeft();
  if (timer.kind === 'work') {
    logFocus(timer, Math.round(timer.dur / 60));
    beep();
    haptic();
    notify('集中時間が終わりました', timer.title);
    const b = DATA.meta.brk || 5;
    // 画面を閉じている間に休憩時間も過ぎていたら、休憩は飛ばす
    timer = lateBy > b * 60000 ? null
      : { taskId: timer.taskId, title: timer.title, kind: 'break', dur: b * 60, startedAt: Date.now(), endsAt: Date.now() + b * 60000, left: null };
  } else {
    beep();

}
function openFocusMode() { if (!timer) return; fmKey = ''; $('focus').hidden = false; tick(); }
function closeFocusMode() {
  if ($('focus').hidden) return;
  $('focus').hidden = true;
  $('focus').replaceChildren();
  fmKey = '';
  tick(); // 下の小さなバーをすぐ出す
}
function tick() {
  const bar = $('focusBar');
  if (!cfg || $('app').hidden) { bar.hidden = true; return; }
  if (timer && timeLeft() <= 0) finishPhase();
  if (!timer) {
    bar.hidden = true;
    barKey = '';
    if (!$('focus').hidden) closeFocusMode();
    document.title = 'Todo';
    return;
  }
  const left = Math.max(0, timeLeft());
  const mmss = `${pad(Math.floor(left / 60000))}:${pad(Math.floor(left / 1000) % 60)}`;
  const paused = timer.left != null;
  const key = `${timer.kind}|${paused}|${timer.taskId}`;
  const kind = timer.kind === 'work' ? '集中' : '休憩';
  const ctrl = () => [
    paused
      ? h('button', { class: 'icon-btn', type: 'button', title: '再開', 'aria-label': '再開', onclick: (e) => { e.stopPropagation(); resumeFocus(); } }, icon('play'))
      : h('button', { class: 'icon-btn', type: 'button', title: '一時停止', 'aria-label': '一時停止', onclick: (e) => { e.stopPropagation(); pauseFocus(); } }, icon('pause')),
    timer.kind === 'work'
      ? h('button', { class: 'icon-btn', type: 'button', title: '終了して記録', 'aria-label': '終了して記録', onclick: (e) => { e.stopPropagation(); stopFocus(); } }, icon('stop'))
      : h('button', { class: 'icon-btn', type: 'button', title: '休憩を飛ばす', 'aria-label': '休憩を飛ばす', onclick: (e) => { e.stopPropagation(); stopFocus(); } }, icon('skip')),
  ];

  }
  $('fbTime').textContent = mmss;
  const f = $('focus');
  bar.hidden = !f.hidden;
  if (!f.hidden) {
    if (key !== fmKey) {
      fmKey = key;
      f.classList.toggle('brk', timer.kind === 'break');
      f.replaceChildren(
        h('button', { class: 'icon-btn fm-close', type: 'button', 'aria-label': '小さくする', title: '小さくする（Esc）', onclick: closeFocusMode }, icon('down')),
        h('div', { class: 'fm-kind' }, kind),
        h('div', { class: 'fm-ring' }, ringSvg(1, 220, 10), h('div', { class: 'fm-time', id: 'fmTime' })),
        h('div', { class: 'fm-title' }, timer.title),
        h('div', { class: 'fm-btns' }, ...ctrl()));
    }
    const v = f.querySelector('.val');
    const c = +v.dataset.c;
    v.style.strokeDashoffset = String(c * (1 - left / (timer.dur * 1000)));
    $('fmTime').textContent = mmss;
  }
  document.title = `${mmss} ${kind}`;
}

      h('span', { class: 'muted', style: 'font-size:14px;text-align:right' }, CAL.state === 'ok'
        ? `${CAL.events.length} 件${CAL.updatedAt ? `（${fmtStamp(CAL.updatedAt)} 更新）` : ''}` : '未設定')),
    CAL.errors.length ? h('p', { class: 'hint', style: 'color:var(--danger);margin-top:-2px' }, CAL.errors.join(' / ')) : null,
    h('div', { class: 'set-row' }, h('span', { class: 'lbl' }, 'データ'),
      h('a', { href: `https://github.com/${cfg.repo}/commits/HEAD/${cfg.path}`, target: '_blank', rel: 'noopener noreferrer' }, '変更履歴')),
    h('p', { class: 'hint' }, 'ホーム画面に追加すると、アプリのように全画面で使えます（iPhone は共有ボタン →「ホーム画面に追加」）。'),
    h('div', { class: 'dlg-foot' },
      h('button', { type: 'button', class: 'btn-danger', onclick: () => {
        if (st.pending.length && !confirm('まだ保存していない変更があります。破棄して接続を解除しますか？')) return;
        closeSheet();
        logout();
      } }, '接続解除'),
      h('button', { type: 'button', class: 'btn-primary', onclick: closeSheet }, '閉じる'))),
  { kind: 'settings', label: '設定' });
}

/* =========================================================================
 * 初回設定・接続
 * 設定画面には文字を出さない。失敗したら怪しい欄を赤枠にし、詳細はコンソールにだけ出す
 * ========================================================================= */
const FIELDS = ['repo', 'token'];
// 「owner/repo/ファイル」を分ける。ファイルを省くと todos.json。GitHub の URL を貼っても受け付ける
function parseTarget(v) {
  let parts = v.trim().replace(/^https?:\/\/github\.com\//, '').split('/').filter(Boolean);
  if (['blob', 'tree'].includes(parts[2])) parts = [...parts.slice(0, 2), ...parts.slice(4)];
  if (parts.length < 2 || !parts.slice(0, 2).every((x) => /^[\w.-]+$/.test(x))) return null;
  return { repo: parts.slice(0, 2).join('/'), path: parts.slice(2).join('/') || 'todos.json' };
}
function showSetup(bad = [], detail) {
  document.title = '';
  $('app').hidden = true;
  for (const id of ['focusBar', 'focus', 'toast', 'sheet', 'backdrop', 'detail']) $(id).hidden = true;
  $('setup').hidden = false;
  for (const id of FIELDS) $(id).classList.toggle('bad', bad.includes(id));
  if (detail) console.warn(detail);
}
function badFields(e) {
  if (e instanceof TypeError) return FIELDS; // 通信できない
  if (e.status === 401 || e.status === 403) return ['token'];
  if (e.status === 404) return ['repo', 'token']; // 名前違い、またはトークンの対象外
  return FIELDS;
}
async function connect() {
  const target = parseTarget($('repo').value);
  const token = $('token').value.trim();
  const bad = [];
  if (!target) bad.push('repo');
  if (!token) bad.push('token');
  if (bad.length) return showSetup(bad);
  const { repo, path } = target;
  cfg = { token, repo, path };
  $('setup').classList.add('busy');
  try {
    const info = await gh('GET', `/repos/${repo}`);
    if (!info.private) {
      cfg = null;
      return showSetup(['repo'], '公開リポジトリには接続しない');
    }
    saveLogin(cfg);
    rememberLogin($('repo').value.trim(), token);
    await showApp(); // 入力欄が消えるので、ブラウザが「パスワードを保存しますか？」と聞く
    $('token').value = '';
  } catch (e) {
    cfg = null;
    showSetup(badFields(e), explain(e));
  } finally {
    $('setup').classList.remove('busy');
  }
}
// ログイン情報をブラウザに保存してもらう（Chrome などは明示的に保存できる。Safari はフォームの送信を見て保存を提案する）。
// 端末内の保存も、容量が足りなくなったときに消されにくいよう申請しておく
function rememberLogin(id, password) {
  try { if (window.PasswordCredential) navigator.credentials.store(new PasswordCredential({ id, password, name: 'Todo' })).catch(() => {}); } catch {}
  try { navigator.storage?.persist?.().catch(() => {}); } catch {}
}
// トークンが通らなかったときは、消さずに入力欄へ戻す（Enter で再試行、または貼り直す）。
// 未保存の変更や前回の内容は端末に残したままにする
function reauth(detail) {
  const token = cfg?.token || store.get(KEY.token) || '';
  cfg = null;
  Object.assign(st, { base: null, sha: null, loaded: false, pending: [], syncing: false });
  clearTimeout(st.timer);
  closeDetail();
  closeSheet();
  closeFocusMode();
  $('content').replaceChildren();
  showSetup(['token'], detail);
  $('token').value = token;
}
async function showApp() {
  $('setup').hidden = true;
  $('app').hidden = false;
  document.title = 'Todo';
  view = loadJSON(KEY.view, { type: 'today' });
  if (!view || typeof view.type !== 'string' || view.type === 'search') view = { type: 'today' };
  prevView = view;
  // 前回の内容をすぐに表示し、裏で最新を取りに行く
  const cache = loadJSON(KEY.cache, null);
  if (cache && cache.key === cfgKey() && cache.base) {
    st.base = normalize(cache.base);
    st.sha = cache.sha || null;
    st.loaded = true;
  }
  st.pending = (loadJSON(KEY.pending, []) || []).filter((op) => op && typeof op.t === 'string');
  const calCache = loadJSON(KEY.cal, null);
  if (calCache && calCache.key === cfgKey()) setCal(calCache.data, 'ok');
  const portalCache = loadJSON(KEY.portal, null);
  if (portalCache && portalCache.key === cfgKey()) setPortal(portalCache.data, 'ok');
  render();
  tick();
  setSync('loading');
  try {
    await fetchBase();
    render();
    if (st.pending.length) sync(); else setSync('fresh');
    maybeSeedRoutines();
    fetchCalendar();
  } catch (e) {
    if (e.status === 401) return reauth(explain(e));
    setSync(e instanceof TypeError ? 'offline' : 'error', e);
  }
}
function logout(bad, detail) {
  for (const k of [KEY.token, KEY.cache, KEY.pending, KEY.timer, KEY.cal, KEY.planPrev, KEY.portal]) store.del(k);
  vault.del('login');
  setCal(null, 'none');
  setPortal(null, 'none');
  planPrev = undefined;
  cfg = null;
  Object.assign(st, { base: null, sha: null, loaded: false, pending: [], syncing: false });
  clearTimeout(st.timer);
  timer = null;
  closeDetail();
  closeSheet();
  closeFocusMode();
  $('content').replaceChildren();
  showSetup(bad || [], detail);
}

/* =========================================================================
 * イベント
 * ========================================================================= */
$('setup').addEventListener('submit', (ev) => ev.preventDefault());
$('setup').addEventListener('submit', () => { if (!$('setup').classList.contains('busy')) connect(); });
// 保存したパスワード（キーチェーンなど）で 2 つの欄が埋まったら、Enter を待たずに接続する。
// 同じ値で失敗したときは繰り返さない
let autoTried = '';
let autoTimer = 0;
function autoConnect() {
  clearTimeout(autoTimer);
  autoTimer = setTimeout(() => {
    const token = $('token').value.trim();
    const key = $('repo').value.trim() + '\n' + token;
    if ($('setup').hidden || $('setup').classList.contains('busy') || key === autoTried) return;
    if (!parseTarget($('repo').value) || !/^(github_pat_\w{40,}|gh[pousr]_\w{30,})$/.test(token)) return;
    autoTried = key;
    connect();
  }, 250);
}
for (const id of FIELDS) {
  $(id).addEventListener('input', () => { $(id).classList.remove('bad'); autoConnect(); });
  $(id).addEventListener('change', autoConnect);
  $(id).addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter' && !ev.isComposing && ev.keyCode !== 229) { // 日本語入力の確定では送らない
      ev.preventDefault();
      // フォームとして送信する（パスワードの保存を提案してもらうため）。送信そのものは止めて、接続だけ行う
      if ($('setup').requestSubmit) $('setup').requestSubmit(); else connect();
    }
  });
}

$('fab').append(icon('plus'));
$('search').before(icon('search'));
$('fab').addEventListener('click', () => { unlockAudio(); openQuickAdd(); });
$('backdrop').addEventListener('click', closeSheet);
$('search').addEventListener('input', (e) => onSearch(e.target.value));
$('helpBtn').append(icon('help'));
$('settingsBtn').append(icon('gear'));
$('retryBtn').append(icon('sync'));
$('helpBtn').addEventListener('click', openHelp);
$('settingsBtn').addEventListener('click', openSettings);
const retry = () => {
  if (syncErrStatus === 401) return reauth(explain({ status: 401 })); // トークンの問題は入力欄で直す
  return st.pending.length ? sync() : reload(false);
};
$('retryBtn').addEventListener('click', retry);
$('syncPill').addEventListener('click', retry);
$('undoBtn').addEventListener('click', undo);
$('focusBar').addEventListener('click', openFocusMode);
document.addEventListener('pointerdown', unlockAudio, { once: true, capture: true });
window.visualViewport?.addEventListener('resize', trackKeyboard);
window.visualViewport?.addEventListener('scroll', trackKeyboard);

// 行のスワイプ（右 = 完了、左 = 日付を変える）
const SWIPE_T = 72;
const sw = { active: false };
let suppressClick = false;
$('content').addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const inner = e.target.closest('.task-inner');
  if (!inner || e.target.closest('button:not(.body), a, input, textarea, select')) return;
  const li = inner.closest('.task');
  Object.assign(sw, { active: true, decided: false, horizontal: false, el: li, inner, id: li.dataset.id, x0: e.clientX, y0: e.clientY, dx: 0, pid: e.pointerId });
});
document.addEventListener('pointermove', (e) => {
  if (!sw.active || e.pointerId !== sw.pid) return;
  const dx = e.clientX - sw.x0;
  const dy = e.clientY - sw.y0;
  if (!sw.decided) {
    if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
    sw.decided = true;
    sw.horizontal = Math.abs(dx) > Math.abs(dy) * 1.4;
    if (!sw.horizontal) { sw.active = false; return; }
    sw.el.classList.add('swiping');
    try { sw.inner.setPointerCapture(e.pointerId); } catch {}
  }
  sw.dx = dx;
  const lim = sw.el.offsetWidth * 0.6;
  sw.inner.style.transform = `translateX(${Math.max(-lim, Math.min(lim, dx))}px)`;
  sw.el.dataset.dir = dx > 0 ? 'right' : 'left';
  const armed = Math.abs(dx) > SWIPE_T;
  if (armed && !sw.armed) haptic();
  sw.armed = armed;
  sw.el.classList.toggle('arm-done', dx > SWIPE_T);
  sw.el.classList.toggle('arm-sched', dx < -SWIPE_T);
}, { passive: true });
function endSwipe(e, cancelled) {
  if (!sw.active || e.pointerId !== sw.pid) return;
  sw.active = false;
  if (!sw.horizontal) return;
  suppressClick = true;
  setTimeout(() => { suppressClick = false; }, 60);
  const { el, inner, id, dx } = sw;
  sw.armed = false;
  inner.style.transition = 'transform .2s ease';
  inner.style.transform = '';
  setTimeout(() => { inner.style.transition = ''; el.classList.remove('swiping', 'arm-done', 'arm-sched'); }, 200);
  if (cancelled) return;
  if (dx > SWIPE_T) completeTask(id, el);
  else if (dx < -SWIPE_T) openSchedule(id);
}
document.addEventListener('pointerup', (e) => endSwipe(e, false));
document.addEventListener('pointercancel', (e) => endSwipe(e, true));

$('content').addEventListener('click', (e) => {
  if (suppressClick) { suppressClick = false; return; }
  const a = e.target.closest('[data-act]');
  if (!a) return;
  const li = a.closest('.task');
  const id = li && li.dataset.id;
  switch (a.dataset.act) {
    case 'toggle': completeTask(id, li); break;
    case 'open': openDetail(id); break;
    case 'myday': toggleMyDay(id); break;
    case 'focus': startFocus(id); break;
    case 'view': setView(JSON.parse(a.dataset.view)); break;
  }
});
function markSel() {
  for (const r of document.querySelectorAll('#content .task')) r.classList.toggle('sel', r.dataset.id === selId);
}
$('content').addEventListener('focusin', (e) => {
  const li = e.target.closest('.task');
  if (li) { selId = li.dataset.id; markSel(); }
});
function moveSel(delta) {
  const rows = [...document.querySelectorAll('#content .task')];
  if (!rows.length) return;
  const i = rows.findIndex((r) => r.dataset.id === selId);
  const next = rows[i < 0 ? (delta > 0 ? 0 : rows.length - 1) : Math.max(0, Math.min(rows.length - 1, i + delta))];
  selId = next.dataset.id;
  markSel();
  next.scrollIntoView({ block: 'nearest' });
}

// キーボード操作
let gWait = false;
document.addEventListener('keydown', (e) => {
  if (!cfg || $('app').hidden) return;
  const el = e.target;
  const typing = el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' || el.isContentEditable;
  if (e.key === 'Escape') {
    if (!$('focus').hidden) closeFocusMode();
    else if (!$('sheet').hidden) closeSheet();
    else if (typing) el.blur();
    else if (detailId) closeDetail();
    else { selId = null; markSel(); }
    return;
  }
  if (!$('sheet').hidden || !$('focus').hidden) return;
  if (typing || e.altKey) return;
  if (e.metaKey || e.ctrlKey) {
    if (e.key === 'z') { e.preventDefault(); undo(); }
    return;
  }
  if ((el.tagName === 'BUTTON' || el.tagName === 'A') && (e.key === ' ' || e.key === 'Enter')) return; // ボタン自体の動作に任せる
  if (gWait) {
    gWait = false;
    const v = { i: 'inbox', t: 'today', u: 'upcoming', a: 'anytime', s: 'someday', m: 'matrix', r: 'review', l: 'logbook' }[e.key];
    if (v) { e.preventDefault(); setView({ type: v }); }
    return;
  }
  const sel = selId && findTask(selId) ? selId : null;
  switch (e.key) {
    case 'g': gWait = true; setTimeout(() => { gWait = false; }, 1500); break;
    case 'n': case 'q': e.preventDefault(); unlockAudio(); openQuickAdd(); break;
    case '/': e.preventDefault(); if (wide()) $('search').focus(); else { setView({ type: 'browse' }); mSearch?.querySelector('input').focus(); } break;
    case 'j': case 'ArrowDown': e.preventDefault(); moveSel(1); break;
    case 'k': case 'ArrowUp': e.preventDefault(); moveSel(-1); break;
    case 'Enter': case 'e': if (sel) { e.preventDefault(); openDetail(sel); } break;
    case 'x': case ' ': if (sel) { e.preventDefault(); completeTask(sel); } break;
    case 't': if (sel) toggleMyDay(sel); break;
    case 's': if (sel) toggleSomeday(sel); break;
    case 'd': if (sel) openSchedule(sel); break;
    case '1': case '2': case '3': case '0': if (sel) setPriority(sel, +e.key); break;
    case 'f': if (sel) startFocus(sel); break;
    case 'Delete': case 'Backspace': if (sel) { e.preventDefault(); deleteTask(sel); } break;
    case 'z': undo(); break;
    case '?': openHelp(); break;
  }
});

// グラフのツールチップ
function showTip(e) {
  const el = e.target.closest && e.target.closest('[data-tip]');
  const tip = $('tip');
  if (!el) { tip.hidden = true; return; }
  tip.textContent = el.dataset.tip;
  tip.hidden = false;
  const r = el.getBoundingClientRect();
  tip.style.left = Math.max(8, Math.min(window.innerWidth - tip.offsetWidth - 8, r.left + r.width / 2 - tip.offsetWidth / 2)) + 'px';
  tip.style.top = Math.max(8, r.top - tip.offsetHeight - 6) + 'px';
}
document.addEventListener('mouseover', showTip);
document.addEventListener('focusin', showTip);
document.addEventListener('scroll', () => { $('tip').hidden = true; }, true);

// 別の端末での変更を拾う・日付が変わったら描き直す
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !cfg) return;
  tick();
  if (st.pending.length) sync(); else reload(true);
  if (Date.now() - CAL.fetchedAt > 5 * 60000) fetchCalendar();
});
setInterval(() => {
  if (!cfg || document.visibilityState !== 'visible') return;
  if (st.pending.length) sync(); else reload(true);
  if (Date.now() - CAL.fetchedAt > 5 * 60000) fetchCalendar(); // 予定は 1 時間ごとにしか変わらないので 5 分おきで十分
  if (renderedDay !== todayYmd() || view.type === 'today') render(); // 今日のタイムラインの現在時刻も進める
}, 60000);
setInterval(tick, 1000);
window.addEventListener('online', () => { if (cfg) sync(); });
window.addEventListener('beforeunload', (ev) => {
  // 未保存の操作は端末に残るので失われないが、送信中だけは念のため確認する
  if (st.syncing) { ev.preventDefault(); ev.returnValue = ''; }
});

/* =========================================================================
 * 起動
 * 初期値は持たない（公開ページに非公開リポジトリの名前を書かないため）。
 * 一度接続した端末では、その端末に保存した値を使う
 * ========================================================================= */
(function init() {
  applyAccent();
  // ホーム画面に追加したときにオフラインでも開けるようにする（GitHub API の通信には関与しない）
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
  const start = (c) => {
    cfg = c;
    $('repo').value = c.path === 'todos.json' ? c.repo : `${c.repo}/${c.path}`;
    showApp();
  };
  const saved = { token: store.get(KEY.token), repo: store.get(KEY.repo), path: store.get(KEY.path) || 'todos.json' };
  if (saved.repo) $('repo').value = saved.path === 'todos.json' ? saved.repo : `${saved.repo}/${saved.path}`;
  try { localStorage.setItem('todo.probe', '1'); localStorage.removeItem('todo.probe'); } catch (e) { console.warn('この画面では端末に保存できません', e); }
  if (validLogin(saved)) {
    start(saved);
    vault.get('login').then((v) => { if (!validLogin(v) || v.token !== saved.token || v.repo !== saved.repo || v.path !== saved.path) saveLogin(saved); });
    return;
  }
  // localStorage が空なら IndexedDB の控えから戻す（少し待っても返事がなければ入力欄を出す）
  let settled = false;
  const fallback = setTimeout(() => { settled = true; showSetup(); }, 1500);
  vault.get('login').then((v) => {
    if (settled) return;
    settled = true;
    clearTimeout(fallback);
    if (validLogin(v)) {
      saveLogin(v);
      start({ token: v.token, repo: v.repo, path: v.path });
    } else {
      showSetup();
    }
  });
})();
</script>
